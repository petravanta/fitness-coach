<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>try{var t=localStorage.getItem('petravanta.theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fitness Coach</title>
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#172129" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fitness">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* ===== Shared look: Skating Mentor · Fitness Coach =====
   Same tokens, type and components across petravanta's apps. Each app only changes the four --accent values below. */
:root{
  --bg:#eef2f4; --surface:#ffffff; --sunk:#e3e9ec; --line:#cdd6db; --ink:#14212a; --muted:#566771; --faint:#8a99a2;
  --lv-new:#9aa8b0; --lv-learn:#c07a00; --lv-dev:#2f6fd0; --lv-conf:#11897a; --lv-solid:#0c5e3e;
  --lv-learn-bg:#fbefd9; --lv-dev-bg:#e1ebfa; --lv-conf-bg:#d9f1ec; --lv-solid-bg:#d5eadf;
  --danger:#b3261e; --danger-soft:#fbe3e1;
  --f-display:"Unbounded","Arial Rounded MT Bold",system-ui,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f161b; --surface:#172129; --sunk:#111a20; --line:#2a3842; --ink:#e4ecf0; --muted:#9fb0ba; --faint:#6b7d88;
  --lv-new:#64757f; --lv-learn:#e6a33a; --lv-dev:#6ea0f0; --lv-conf:#3cc3ad; --lv-solid:#6fd39a;
  --lv-learn-bg:#3a2a10; --lv-dev-bg:#182a45; --lv-conf-bg:#0f3530; --lv-solid-bg:#143224;
  --danger:#ff8a80; --danger-soft:#3d1c1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161b; --surface:#172129; --sunk:#111a20; --line:#2a3842; --ink:#e4ecf0; --muted:#9fb0ba; --faint:#6b7d88;
  --lv-new:#64757f; --lv-learn:#e6a33a; --lv-dev:#6ea0f0; --lv-conf:#3cc3ad; --lv-solid:#6fd39a;
  --lv-learn-bg:#3a2a10; --lv-dev-bg:#182a45; --lv-conf-bg:#0f3530; --lv-solid-bg:#143224;
  --danger:#ff8a80; --danger-soft:#3d1c1a; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar{display:flex;align-items:center;gap:16px;padding-block:12px 0;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.brand svg{width:26px;height:26px;flex:none}
.save-state{margin-left:auto;font-size:12px;color:var(--muted);font-family:var(--f-mono)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-top:8px;scrollbar-width:none}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px 9px;font-weight:600;color:var(--muted);white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
main{padding-block:20px 80px}
h2{font-family:var(--f-display);font-weight:500;font-size:20px;letter-spacing:-.01em;margin:0;text-wrap:balance}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none}
.btn.danger{color:var(--danger)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.big{padding:12px 22px;font-size:16px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
label.field{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
select,input[type=text],input[type=number],textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:15px;text-transform:none;letter-spacing:0;font-weight:500;min-width:0}
textarea{resize:vertical}
.ctx{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:end}
@media (max-width:720px){.ctx{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ctx-note{font-size:13px;color:var(--muted);margin-top:10px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.pill.l1{background:var(--lv-learn-bg);color:var(--lv-learn)}
.pill.l2{background:var(--lv-dev-bg);color:var(--lv-dev)}
.pill.l3{background:var(--lv-conf-bg);color:var(--lv-conf)}
.pill.l4{background:var(--lv-solid-bg);color:var(--lv-solid)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:720px){.two{grid-template-columns:minmax(0,1fr)}}
.banner{background:var(--accent-soft);border-radius:var(--r);padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner p{flex:1 1 260px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:620px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat b{display:block;font-family:var(--f-mono);font-size:24px;font-weight:500}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.meter{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.scrim{position:fixed;inset:0;background:rgba(10,16,20,.35);z-index:40}
.drawer{position:fixed;z-index:41;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);border-left:1px solid var(--line);overflow-y:auto;
  padding:calc(env(safe-area-inset-top,0px) + 18px) max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) 18px;display:flex;flex-direction:column;gap:16px}
@media (max-width:640px){.drawer{top:auto;left:0;width:100%;max-height:86vh;border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;padding-left:max(18px,env(safe-area-inset-left,0px))}}
.drawer .x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:max(12px,env(safe-area-inset-right,0px));background:var(--sunk);border:0;border-radius:999px;width:32px;height:32px;font-size:18px;line-height:1}
@media (max-width:640px){.drawer .x{top:12px}}
.drawer h2{padding-right:40px}
.drawer ul,.cues{margin:0;padding-left:18px}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:inline-flex;align-items:center;gap:5px;font-size:13px;border:1px solid var(--line);border-radius:6px;padding:3px 8px;background:var(--sunk)}
.entry{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:8px 0;border-top:1px solid var(--line)}
.entry .meta{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:60;max-width:calc(100% - 32px)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.4}}}
/* ===== end shared look ===== */

/* Fitness Coach accent */
:root{--accent:#4f46c8;--accent-ink:#ffffff;--accent-soft:#e6e4fb}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--accent:#9d95ff;--accent-ink:#120f33;--accent-soft:#25224d}}
:root[data-theme="dark"]{--accent:#9d95ff;--accent-ink:#120f33;--accent-soft:#25224d}

/* Layout: plan is a column of blocks (a block is one exercise or a superset); the workout runner replaces the plan with one big card at a time (set, then rest timer). */
.plan{display:flex;flex-direction:column;gap:12px}
.block{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;grid-template-columns:52px minmax(0,1fr);gap:4px 14px}
.block .slot{grid-row:1/span 2;text-align:center;padding-top:2px}
.block .slot b{display:block;font-family:var(--f-mono);font-size:18px;font-weight:500}
.block .slot span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.role{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.role.warm{color:var(--lv-dev)} .role.power{color:var(--lv-learn)} .role.sport{color:var(--lv-conf)} .role.cond{color:var(--muted)}
.exl{display:flex;flex-direction:column;gap:10px}
.ex{display:grid;grid-template-columns:auto 44px minmax(0,1fr) auto;gap:2px 10px;align-items:start}
.ex .figbtn{grid-row:span 3;background:var(--sunk);border:0;border-radius:10px;padding:2px;width:44px;height:44px}
.ex .dose,.ex .setrows,.ex .sug{grid-column:3/span 2!important}
.fig{display:block;width:100%;height:100%;overflow:visible}
.fig .fb{fill:none;stroke:var(--ink);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.fig .fh{fill:var(--ink)}
.fig .fl{stroke:var(--line);stroke-width:1}
.fig .sc{fill:none;stroke:var(--faint);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.fig .dash{stroke-dasharray:2 2}
.fig .gl{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round}
.fig .gf{fill:var(--accent)}
.fig .gp{fill:none;stroke:var(--accent);stroke-width:2}
.fig .gb{fill:none;stroke:var(--accent);stroke-width:1.4;stroke-dasharray:2 1.6}
.figbox{flex:none;width:40px;height:40px;background:var(--sunk);border-radius:8px;padding:2px}
.runhead{display:flex;gap:14px;align-items:center}
.runhead .figbox{width:72px;height:72px;border-radius:14px;padding:4px}
.drawerfig{width:96px;height:96px;background:var(--sunk);border-radius:16px;padding:6px;margin-bottom:8px}
.ex .tag{font-family:var(--f-mono);font-size:12px;color:var(--faint);padding-top:3px;min-width:20px}
.ex .name{font-weight:700;font-size:16px;background:none;border:0;padding:0;text-align:left;color:var(--ink)}
.ex .name:hover{text-decoration:underline;text-decoration-color:var(--accent)}
.ex .dose{grid-column:2;font-size:14px}
.ex .sug{grid-column:2/span 2;font-size:13px;color:var(--muted)}
@media (max-width:560px){.block{grid-template-columns:minmax(0,1fr)}.block>*,.block .exl{grid-column:1!important}.blkhead .role{flex-basis:100%}.block .slot{grid-row:auto;text-align:left;display:flex;gap:6px;align-items:baseline}.block .slot b{display:inline;font-size:14px}}
/* runner */
.runbar{display:flex;gap:8px 16px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.runbar b{color:var(--ink)}
.runcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px}
.runcard .big-name{font-family:var(--f-display);font-weight:500;font-size:24px;letter-spacing:-.01em;background:none;border:0;padding:0;text-align:left;color:var(--ink);line-height:1.25}
.target{font-size:16px;font-weight:600}
.steppers{display:flex;gap:16px;flex-wrap:wrap}
.stepper{display:flex;flex-direction:column;gap:6px}
.stepper .ctl{display:flex;align-items:center;gap:6px}
.stepper button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--sunk);font-size:20px;font-weight:600}
.stepper input{width:92px;text-align:center;font-family:var(--f-mono);font-size:22px;padding:8px 6px}
.done-set{width:100%;padding:16px;font-size:18px;border-radius:14px}
.rest{text-align:center;align-items:center}
.clock{font-family:var(--f-mono);font-weight:500;font-size:clamp(64px,22vw,128px);line-height:1;font-variant-numeric:tabular-nums}
.rest .meter{width:100%;height:10px}
.rest.over{border-color:var(--danger);background:var(--danger-soft)}
.rest.over .clock{color:var(--danger)}
.rest.over .meter i{background:var(--danger)}
.focus-line{font-size:15px;color:var(--muted);font-style:italic}
.next{background:var(--sunk);border-radius:10px;padding:12px 14px;text-align:left;width:100%}
.blkhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.blkhead .role{margin-right:auto}
.setsctl{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--muted)}
.setsctl b{color:var(--ink);min-width:1.2em;text-align:center}
.setsctl .btn{min-width:32px;padding:3px 0;line-height:1.2}
.setsctl .btn:disabled{opacity:.35;cursor:default}
.setrows{grid-column:2/span 2;display:flex;flex-wrap:wrap;gap:6px}
.setrows span{font-family:var(--f-mono);font-size:13px;background:var(--sunk);border-radius:6px;padding:2px 8px}
.setrows i{font-style:normal;color:var(--faint);margin-right:6px}
.setlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.setrow{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;background:var(--surface);border:0;border-top:1px solid var(--line);padding:8px 12px;min-height:44px}
.setrow:first-child{border-top:0}
.setrow i{font-style:normal;font-size:13px;color:var(--muted)}
.setrow em{font-style:normal;font-size:13px;font-weight:700}
.setrow.done em{color:var(--lv-conf)}
.setrow.now{background:var(--accent-soft)}
.setrow.now em{color:var(--accent)}
.setrow.skipped span{color:var(--faint);text-decoration:line-through}
.grip{flex:none;display:inline-grid;place-items:center;width:36px;height:36px;margin:-6px -6px -6px 0;border:0;border-radius:8px;background:none;color:var(--faint);cursor:grab;touch-action:none}
.grip svg{width:12px;height:18px}
.grip:hover,.grip:focus-visible{color:var(--ink);background:var(--sunk)}
[data-dragitem]{transition:transform .15s ease}
[data-dragitem].dragging{transition:none;position:relative;z-index:5;box-shadow:0 10px 28px rgba(10,16,20,.18);cursor:grabbing}
body.is-dragging{user-select:none;-webkit-user-select:none;cursor:grabbing}
.rungroup{display:flex;align-items:center;gap:4px;background:var(--surface);border-bottom:1px solid var(--line)}
.rungroup .runrows{flex:1;min-width:0}
.rungroup .runitem:last-child{border-bottom:0}
.rungroup .grip{margin:0}
@media (max-width:640px){.grip{width:44px;height:44px}}
.exbtns{display:inline-flex;gap:2px}
.ex .name .more{color:var(--faint);font-weight:500}
.planned{background:var(--accent-soft);border-color:transparent}
.tpllist{display:flex;flex-direction:column}
.tplrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.tplrow>div{min-width:0}
.xbtn{font-size:18px;line-height:1;padding:3px 10px;color:var(--muted)}
@media (max-width:640px){.exbtns .btn{min-height:40px}}
#pickq{width:100%;font-size:16px}
.picklist{display:flex;flex-direction:column}
.pickhead{margin:14px 0 4px}
.pickrow{display:grid;grid-template-columns:40px minmax(0,1fr);gap:2px 12px;align-items:center;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 4px;min-height:52px}
.pickrow:hover{background:var(--sunk)}
.pickrow .nm{font-weight:600}
.pickrow .figbox{grid-row:span 2}
.runitem{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line)}
.runitem .runrow{flex:1;border-bottom:0}
@media (max-width:640px){.setsctl .btn{min-width:40px;min-height:40px}}
.setlog{display:flex;flex-wrap:wrap;gap:6px}
.setlog span{font-family:var(--f-mono);font-size:13px;background:var(--sunk);border-radius:6px;padding:2px 8px}
.upnext{font-size:13px;color:var(--muted)}
/* progress */
.bars{display:flex;flex-direction:column;gap:10px}
.barrow{display:grid;grid-template-columns:150px minmax(0,1fr) 190px;gap:12px;align-items:center;font-size:14px}
.barrow .lbl{font-weight:600}
.barrow .val{font-size:12px;text-align:right}
@media (max-width:560px){.barrow{grid-template-columns:110px minmax(0,1fr);}.barrow .val{grid-column:2;text-align:left;margin-top:-6px}}
.barrow .meter i.l0{background:var(--lv-new)} .barrow .meter i.l1{background:var(--lv-learn)} .barrow .meter i.l2{background:var(--lv-dev)} .barrow .meter i.l3{background:var(--lv-conf)} .barrow .meter i.l4{background:var(--lv-solid)}
.mbar{position:relative}
.mbar .goal{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.5}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--muted);font-family:var(--f-mono);font-size:11px}
.chart .line{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .cross{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:8px;padding:6px 10px;font-size:12px;white-space:nowrap;transform:translate(-50%,-110%)}
.exrow{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.exrow:last-child{border-bottom:0}
.exrow .nm{background:none;border:0;padding:0;text-align:left;font-weight:600;color:var(--ink)}
.star{background:none;border:0;font-size:20px;line-height:1;color:var(--faint);padding:2px}
.star[aria-pressed="true"]{color:var(--accent)}
.needs{font-size:12px;color:var(--faint)}
input[type=range]{width:100%;accent-color:var(--accent)}
/* tab icons show only in the phone tab bar */
nav.tabs svg{display:none;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs .short{display:none}
button,a{touch-action:manipulation}
/* Phone: tabs become a bottom bar within thumb reach; controls get 44px touch targets */
@media (max-width:640px){
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);gap:0;justify-content:space-around;
    padding:4px max(4px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 4px) max(4px,env(safe-area-inset-left,0px))}

<script>
/* ---------------- Catalog ---------------- */
// Exercises, sports and equipment live in data/*.json so anyone can review or add to them in a pull request (see CONTRIBUTING.md).
async function loadCatalog(names){
  const out={};
  await Promise.all(names.map(async n=>{const r=await fetch('data/'+n+'.json'); if(!r.ok) throw new Error(n); out[n]=await r.json()}));

}
(async()=>{
const CATALOG=await loadCatalog(['exercises','sports','equipment','figures']).catch(e=>{
  document.body.insertAdjacentHTML('afterbegin','<p class="load-error" role="alert">Couldn’t load the exercise library. Check your connection and reload.</p>');
  throw e});

/* ---------------- Library ---------------- */
const PAT={squat:'Squat',hinge:'Hinge',single:'Single-leg',hpush:'Horizontal push',vpush:'Vertical push',hpull:'Horizontal pull',vpull:'Vertical pull',
  carry:'Carry & grip',core:'Core',power:'Power & jumps',arms:'Arms',calves:'Calves & shins',shoulder:'Shoulder health',cond:'Conditioning',mob:'Mobility'};
// Movement patterns that get a strength score on the Progress tab
const SCORED=['squat','hinge','single','hpush','vpush','hpull','vpull','carry','core'];
const MUS={chest:'Chest',shoulders:'Shoulders',back:'Back',arms:'Arms',abs:'Abs & obliques',glutes:'Glutes',quads:'Quads',hams:'Hamstrings',calves:'Calves'};
const QUAL={power:'explosive power',single:'single-leg strength',lat:'lateral movement',rot:'rotation',grip:'grip',endur:'endurance',mob:'mobility',core:'trunk stability',post:'posterior chain',shoulder:'shoulder resilience'};
const SPORTS=Object.fromEntries(CATALOG.sports.map(s=>[s.id,{n:s.name,q:s.qualities}]));
const EQUIP=Object.fromEntries(CATALOG.equipment.map(e=>[e.id,e.name]));
const TRACK={wr:'Weight × reps',bw:'Bodyweight reps',time:'Time'};

// E(id, name, pattern, muscles (first is primary), equipment options ("a+b|c", "-" = none), tracking, extras)
// std: estimated-max ÷ bodyweight that counts as "strong" (score 100); bwf: share of bodyweight moved; per: weight is per hand;
// reps/base: reps or seconds that count as strong for bodyweight-only or timed holds
function E(id,n,p,m,eq,t,o={}){return{id,n,p,m:m.split(' '),eq:eq.split('|').map(s=>s==='-'?[]:s.split('+')),t,q:(o.q||'').split(' ').filter(Boolean),c:o.c||[],
  std:o.std||null,bwf:o.bwf||0,per:!!o.per,main:!!o.main,reps:o.reps||null,base:o.base||null,sub:o.sub||null,fig:o.fig||null}}
// Exercises come from data/exercises.json; the readable field names there map onto the short ones the app uses
const TRACK_ID={'weight-reps':'wr','bodyweight-reps':'bw',time:'time'}, ARM_ID={biceps:'bi',triceps:'tri'};
const LIB=CATALOG.exercises.map(x=>E(x.id,x.name,x.pattern,x.muscles.join(' '),x.equipment.map(o=>o.length?o.join('+'):'-').join('|'),TRACK_ID[x.tracking],
  {std:x.strongRatio,bwf:x.bodyweightShare,per:x.perHand,main:x.mainLift,reps:x.strongReps,base:x.strongSeconds,sub:ARM_ID[x.armFocus],fig:x.figure,q:(x.qualities||[]).join(' '),c:x.cues}));
let EX=LIB, BYID={};
/* ----- Exercise figures: stick figures from data/figures.json, with the gear the exercise uses drawn at the hands ----- */
const FIG=Object.fromEntries(CATALOG.figures.map(f=>[f.id,f]));
const FIG_BY_PAT={squat:'goblet',hinge:'hinge',single:'lunge',hpush:'pushup',vpush:'press',hpull:'row',vpull:'pullup',carry:'farmer',core:'plank',power:'jump',arms:'curl',calves:'calf',shoulder:'facepull',cond:'burpee',mob:'stretch'};
const FIG_GEAR=['barbell','dumbbell','kettlebell','medball','cable','band'];
function figure(x,cls='fig'){
  const f=FIG[x.fig]||FIG[FIG_BY_PAT[x.p]]; if(!f) return '';
  const h=has(), opts=[...x.eq.filter(o=>o.every(e=>h.has(e))),...x.eq], g=(()=>{for(const o of opts) for(const k of FIG_GEAR) if(o.includes(k)) return k; return null})();
  const H=f.hold||[], A=f.anchor||[46,3]; let gear='';
  if(g==='barbell'&&H[0]) gear=f.gear==='bar-over'&&H[1]?`<path d="M${H[0][0]-8} ${H[0][1]}H${H[1][0]+8}" class="gl"/><rect x="${H[0][0]-10}" y="${H[0][1]-4}" width="3" height="8" rx="1" class="gf"/><rect x="${H[1][0]+7}" y="${H[1][1]-4}" width="3" height="8" rx="1" class="gf"/>`
    :`<circle cx="${H[0][0]}" cy="${H[0][1]}" r="5" class="gp"/><circle cx="${H[0][0]}" cy="${H[0][1]}" r="1.3" class="gf"/>`;
  else if(g==='dumbbell') gear=H.map(([a,b])=>`<path d="M${a-3.5} ${b}H${a+3.5}" class="gl"/><rect x="${a-5.5}" y="${b-2.5}" width="2.4" height="5" rx=".8" class="gf"/><rect x="${a+3.1}" y="${b-2.5}" width="2.4" height="5" rx=".8" class="gf"/>`).join('');
  else if(g==='kettlebell'&&H[0]){const [a,b]=H[0]; gear=`<path d="M${a-2.2} ${b+2}a2.2 2.4 0 0 1 4.4 0" class="gl"/><circle cx="${a}" cy="${b+5}" r="3.4" class="gf"/>`}
  else if(g==='medball'&&H[0]) gear=`<circle cx="${H[0][0]}" cy="${H[0][1]}" r="4.2" class="gf"/>`;
  else if((g==='cable'||g==='band')&&H[0]) gear=f.gear==='band-between'&&H[1]?`<path d="M${H[0][0]} ${H[0][1]}H${H[1][0]}" class="gb"/>`:`<path d="M${H[0][0]} ${H[0][1]}L${A[0]} ${A[1]}" class="gb"/>${g==='cable'?`<circle cx="${A[0]}" cy="${A[1]}" r="1.6" class="gf"/>`:''}`;
  return `<svg class="${cls}" viewBox="0 0 48 48" aria-hidden="true"><path d="M2 45.5H46" class="fl"/>${(f.scene||[]).map(d=>`<path d="${d}" class="sc"/>`).join('')}${(f.dashed||[]).map(d=>`<path d="${d}" class="sc dash"/>`).join('')}${f.lines.map(l=>`<polyline points="${l}" class="fb"/>`).join('')}<circle cx="${f.head[0]}" cy="${f.head[1]}" r="3.6" class="fh"/>${gear}</svg>`;
}
function rebuildLibrary(){
  EX=LIB.concat((state.profile.customEx||[]).map(c=>Object.assign(E(c.id,c.n,c.p,(c.m&&c.m.length?c.m:['abs']).join(' '),c.eq&&c.eq.length?c.eq.join('+'):'-',c.t,{c:c.c||[],sub:c.sub}),{custom:true})));
  BYID={}; EX.forEach(x=>BYID[x.id]=x);
}

/* ---------------- State & storage ---------------- */
/* Data lives in one file in the user's Google Drive (see the Drive store below). The OAuth client is shared by all apps on https://petravanta.github.io. */
const GOOGLE_CLIENT_ID=/^(petravanta\.github\.io|localhost)$/.test(location.hostname)?'326863468616-4hf2conk0ks0s4qdva9tphphdo7ht7eh.apps.googleusercontent.com':'';
const DAY=86400000, LB=2.20462;
const uid6=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
function defaultProfile(){return{
  v:1, units:'kg', bw:75,
  equipment:['barbell','rack','bench','dumbbell','kettlebell','cable','pullup','dip','band','box','medball','abwheel','rower','bike'],
  customEq:[], favorites:['bsquat','pullup','bss','farmer'], sports:['skate'], muscles:['shoulders','back','glutes'], balance:55,
  customEx:[], rest:{main:150,acc:75,ss:60,power:90,core:45}, sound:true,
  ctx:{minutes:60,focus:'auto',sport:'all'}, examples:true
};}
function fixProfile(p){const d=defaultProfile();return Object.assign(d,p,{rest:Object.assign(d.rest,p.rest||{}),ctx:Object.assign(d.ctx,p.ctx||{})})}
let state={profile:defaultProfile(),sessions:[],deleted:[]}, active=null, planCache=null;
// mode: 'loading' | 'signin' | 'ready' (saving to Drive) | 'demo' (nothing saved) | 'error'
let mode='loading';
rebuildLibrary();
function setSaveState(t){document.getElementById('saveState').textContent=t}
function persist(){state.active=active; state.plan=planCache; if(mode==='ready') store.save({profile:state.profile,sessions:state.sessions,deleted:state.deleted,active,plan:planCache})}
function saveProfile(){state.profile.updatedAt=new Date().toISOString();persist()}
function touchProfile(){state.profile.examples=false;saveProfile()}
function useData(d){state={profile:fixProfile(d.profile||{}),sessions:Array.isArray(d.sessions)?d.sessions:[],deleted:d.deleted||[]}; active=d.active||null; planCache=d.plan||null; rebuildLibrary()}
// Combine two copies (Drive and unsaved changes, or two devices): every workout from both minus deletions, the more recently edited settings, the more recently touched workout in progress
function mergeData(a,b){
  const del=new Set([...(a.deleted||[]),...(b.deleted||[])]);
  const by=new Map(); [...(b.sessions||[]),...(a.sessions||[])].forEach(s=>{if(s&&s.id&&!del.has(s.id))by.set(s.id,s)});
  const pa=a.profile, pb=b.profile, profile=pa&&(!pb||(pa.updatedAt||'')>=(pb.updatedAt||''))?pa:pb||{};
  let act=[a.active,b.active].filter(Boolean).sort((x,y)=>(y.upd||0)-(x.upd||0))[0]||null;
  if(act&&by.has(act.id)) act=null;
  return {profile:fixProfile(profile),sessions:[...by.values()].sort((x,y)=>x.ts<y.ts?-1:1),deleted:[...del],active:act,plan:a.plan||b.plan||null};
}
/* ===== Drive store: petravanta's apps =====
   Canonical copy: https://github.com/petravanta/general/blob/main/shared/drive-store.js (see STANDARDS.md, "Data lives in Google Drive").
   Keeps an app's data in one JSON file in the user's Google Drive (drive.file scope: the app only sees files it created).
   The browser keeps only sign-in details, and a copy of changes that haven't reached Drive yet (for example while offline);
   that copy is deleted as soon as Drive has it. */
function DriveStore(o){
  // o: {clientId, file:'App data.json', app:'app-id', key:'localStorage prefix', empty:()=>data, merge:(remote,local)=>data, onChange:()=>{}}
  const API='https://www.googleapis.com', SCOPE='https://www.googleapis.com/auth/drive.file';
  const get=k=>{try{return JSON.parse(localStorage.getItem(o.key+'.'+k)||'null')}catch(e){return null}};
  const put=(k,v)=>{try{v==null?localStorage.removeItem(o.key+'.'+k):localStorage.setItem(o.key+'.'+k,JSON.stringify(v));return true}catch(e){return false}};
  const S={token:null,exp:0,fileId:get('file'),known:!!get('known'),data:null,busy:false,err:null,last:null,timer:null,ask:0};
  const t=get('token'); if(t&&t.exp>Date.now()){S.token=t.token;S.exp=t.exp}
  const live=()=>!!S.token&&Date.now()<S.exp;
  const note=()=>{try{o.onChange&&o.onChange()}catch(e){}};
  function gis(){return new Promise((res,rej)=>{
    if(window.google&&google.accounts&&google.accounts.oauth2) return res();
    const s=document.createElement('script'); s.src='https://accounts.google.com/gsi/client'; s.onload=res; s.onerror=()=>rej({code:'offline'}); document.head.appendChild(s)})}
  // Asking for a token opens Google's window, so call this from a tap. For an account that already agreed, the window closes by itself.
  function signIn(){return new Promise(async(res,rej)=>{
    try{await gis()}catch(e){return rej(e)}
    google.accounts.oauth2.initTokenClient({client_id:o.clientId,scope:SCOPE,error_callback:rej,
      callback:r=>{if(r.error) return rej(r); S.token=r.access_token; S.exp=Date.now()+(Number(r.expires_in||3600)-60)*1000; put('token',{token:S.token,exp:S.exp}); S.known=true; put('known',true); res()}
    }).requestAccessToken({prompt:S.known?'':'consent'});
  })}
  async function call(path,opt={}){
    if(!live()) throw {code:'expired'};
    let r; try{r=await fetch(API+path,{...opt,headers:{...(opt.headers||{}),Authorization:'Bearer '+S.token}})}catch(e){throw {code:'offline'}}
    if(r.status===401){S.token=null; put('token',null); throw {code:'expired'}}
    if(!r.ok) throw {code:'http',status:r.status};
    return r;
  }
  async function find(){
    if(S.fileId){try{const j=await (await call(`/drive/v3/files/${S.fileId}?fields=id,trashed`)).json(); if(!j.trashed) return S.fileId}catch(e){if(e.code!=='http') throw e}}
    const q=encodeURIComponent(`name='${o.file.replace(/'/g,"\\'")}' and trashed=false`);
    const j=await (await call(`/drive/v3/files?q=${q}&orderBy=modifiedTime desc&fields=files(id)`)).json();
    S.fileId=j.files&&j.files[0]?j.files[0].id:null; put('file',S.fileId); return S.fileId;
  }
  async function read(){const id=await find(); return id?(await call(`/drive/v3/files/${id}?alt=media`)).json():null}
  async function write(data){
    const body=JSON.stringify({app:o.app,saved:new Date().toISOString(),...data}), id=await find();
    if(id){await call(`/upload/drive/v3/files/${id}?uploadType=media`,{method:'PATCH',headers:{'Content-Type':'application/json'},body});return}
    const b='b'+Math.random().toString(36).slice(2), meta=JSON.stringify({name:o.file,mimeType:'application/json'});
    const j=await (await call('/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},
      body:`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${meta}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${b}--`})).json();
    S.fileId=j.id; put('file',j.id);
  }
  async function flush(){
    clearTimeout(S.timer); if(!S.data||S.busy) return;
    if(!live()){note();return}
    S.busy=true; note();
    try{await write(S.data); S.err=null; S.last=new Date(); put('pending',null)}
    catch(e){S.err=e.code==='expired'?null:e.code==='offline'?'offline':'error'}
    finally{S.busy=false; note()}
  }
  // Load: Drive's copy, merged with any changes this browser hadn't saved yet. Creates the file on first use.
  async function load(interactive){
    if(!live()){ if(!interactive) throw {code:'expired'}; await signIn() }
    S.busy=true; note();
    const pending=get('pending');
    try{
      const remote=await read();
      let data=remote?o.merge(remote,o.empty()):o.empty();
      if(pending) data=o.merge(pending,data);
      S.data=data; S.err=null; S.last=new Date();
      if(!remote||pending){await write(data); put('pending',null)}
      return data;
    }catch(e){
      // offline with unsaved changes: carry on from them; they go to Drive once the connection is back
      if(e.code==='offline'&&pending){S.data=o.merge(pending,o.empty()); S.err='offline'; return S.data}
      S.err=e.code==='offline'?'offline':e.code==='expired'?null:'error'; throw e;
    }finally{S.busy=false; note()}
  }
  // Pick up changes made on another device
  async function refresh(){
    if(!live()||S.busy||!S.data) return false;
    try{const r=await read(); if(!r) return false; const before=JSON.stringify(S.data); S.data=o.merge(r,S.data); return JSON.stringify(S.data)!==before}
    catch(e){return false}
  }
  function save(data){S.data=data; if(!put('pending',data)) {/* storage full or blocked: Drive still gets it */} clearTimeout(S.timer); S.timer=setTimeout(flush,1500); note()}
  function signOut(){
    if(S.token&&window.google&&google.accounts&&google.accounts.oauth2) google.accounts.oauth2.revoke(S.token,()=>{});
    S.token=null; S.data=null; ['token','known','file','pending'].forEach(k=>put(k,null)); S.known=false; note();
  }
  // Tokens last an hour. Renew on a tap when it is close to running out or gone, then save anything waiting.
  document.addEventListener('click',e=>{
    if(!o.clientId||!S.known||e.target.closest('[data-drive]')) return;
    if(S.exp-Date.now()>10*60000||Date.now()-S.ask<60000) return;
    S.ask=Date.now(); signIn().then(flush).catch(()=>note());
  },true);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden') flush()});
  window.addEventListener('online',()=>flush());
  function status(){
    if(!S.data) return '';
    if(S.busy) return 'Saving to Google Drive…';
    const waiting=!!get('pending');
    if(S.err==='offline') return 'Offline · changes save to Drive when you’re back online';
    if(S.err) return 'Couldn’t reach Google Drive · will retry';
    if(!live()) return waiting?'Tap anywhere to reconnect Google Drive':'Google Drive sign-in expired';
    if(waiting) return 'Saving to Google Drive…';
    return 'Saved to Google Drive'+(S.last?' · '+S.last.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}):'');
  }
  return {load,save,flush,refresh,signIn,signOut,status,live,
    get data(){return S.data}, get known(){return S.known}, get configured(){return !!o.clientId}, get file(){return o.file},
    get needsTap(){return !!S.data&&!live()}};
}
/* ===== end Drive store ===== */

const store=DriveStore({clientId:GOOGLE_CLIENT_ID,file:'Fitness Coach data.json',app:'fitness-coach',key:'fc',
  empty:()=>({profile:null,sessions:[],deleted:[],active:null,plan:null}),merge:mergeData,onChange:()=>showDriveStatus()});
function showDriveStatus(){
  const b=document.getElementById('driveResume');
  setSaveState(mode==='ready'?store.status():mode==='demo'?'Preview · not saved':'');
  if(b) b.hidden=!(mode==='ready'&&store.needsTap);
}
function drivePanel(){
  if(!store.configured) return `<p class="small muted">This preview doesn’t save anything. Open the app at petravanta.github.io/fitness-coach to keep your data in Google Drive.</p>`;
  if(mode!=='ready') return `<p class="small">Fitness Coach keeps your workouts and settings in your own Google Drive, so they follow you to any device. Right now nothing is being saved.</p>
    <div class="row"><button class="btn sm primary" data-act="signin" data-drive="1">Connect Google Drive</button></div>`;
  return `<p class="small">${esc(store.status())}. Everything is saved to <b>${esc(store.file)}</b> in your Drive a moment after each change. The app can only see files it created there.</p>

let lastSummary=null;

function buildSteps(plan){

    if(b.role==='warm'){b.items.forEach((it,ii)=>steps.push({b:bi,i:ii,s:0,rest:0}));return}
    const sets=b.items[0].d.sets;
    for(let s=0;s<sets;s++) b.items.forEach((it,ii)=>steps.push({b:bi,i:ii,s,rest:ii===b.items.length-1?b.rest:0}));
    const last=steps[steps.length-1]; last.rest=60; last.move=true;

  if(steps.length) steps[steps.length-1].rest=0;

function startWorkout(){
  const plan=JSON.parse(JSON.stringify(getPlan()));
  active={id:uid6(),started:Date.now(),focus:plan.focus,tpl:plan.tpl,est:plan.est,plan,steps:buildSteps(plan),k:0,phase:'set',log:{},rests:[],draft:null};
  initDraft(); saveActive(); keepAwake(true); audio(); render(); window.scrollTo(0,0);
}
// Moving around the workout: steps can be done in any order; "open" steps are neither logged nor skipped
const isOpen=j=>!active.log[j]&&!active.steps[j].skip;
function nextOpen(from){const n=active.steps.length;for(let j=from;j<n;j++)if(isOpen(j))return j;for(let j=0;j<Math.min(from,n);j++)if(isOpen(j))return j;return -1}
function exList(){const m=new Map();active.steps.forEach((s,j)=>{const key=s.b+':'+s.i;if(!m.has(key))m.set(key,{b:s.b,i:s.i,steps:[]});m.get(key).steps.push(j)});return [...m.values()]}

function goExercise(b,i){

// Change the running workout's plan; logged and skipped sets stay with the same exercise and set number

function viewRun(){

    <div class="meter"><i style="width:${total?doneN/total*100:0}%"></i></div>`+nav;
  if(A.phase==='done'||!curItem()){
    return `<div class="stack">${bar}<section class="runcard rest"><h2>All sets done</h2><p class="muted">Nice work. Save it to update your progress.</p>
      <button class="btn primary done-set" data-act="endSave">Save workout</button>${doneN?`<button class="btn sm ghost" data-act="undo">Undo last set</button>`:''}</section></div>`;
  }
  const c=curItem(), x=c.x, d=c.it.d, ss=c.b.items.length>1&&c.b.role!=='warm', label=`${ROLE_NAME[c.b.role]}${ss?' · superset '+exTag(c.st.b,c.st.i):''}`;

  const target=d.secs?`${d.secs}s${x.p==='mob'?' each side':''}`:`${d.reps[0]}–${d.reps[1]} reps`;
  if(A.phase==='rest'&&A.rest){
    const nextTxt=x.t==='time'?`${A.draft&&A.draft.t||d.secs}s`:x.t==='bw'?`${A.draft&&A.draft.r||d.reps[0]} reps`:`${A.draft&&A.draft.w!=null?wtxt(A.draft.w)+' × ':''}${A.draft&&A.draft.r||d.reps[0]}`;

      <p class="focus-line">${esc(FOCUS_LINES[A.k%FOCUS_LINES.length])}</p>
      <div class="next"><div class="small muted">Next · ${esc(label)} ${setN?'· '+setN:''}</div><div style="font-weight:700;font-size:17px">${esc(x.n)}</div>
        <div class="mono">${esc(nextTxt)}</div>${x.c[0]?`<div class="small muted">Cue: ${esc(x.c[A.k%x.c.length])}</div>`:''}</div>
      <div class="row" style="justify-content:center"><button class="btn sm" data-act="restAdj" data-v="-15">−15s</button><button class="btn sm" data-act="restAdj" data-v="30">+30s</button></div>
      <button class="btn primary done-set" data-act="startSet">Start set</button>
      <button class="btn sm ghost" data-act="undo">Undo last set</button></section></div>`;
  }
  const dr=A.draft||{}, prev=loggedFor(c.it.ex);
  const stepper=(k,lbl,val,stp)=>`<div class="stepper"><label class="field" for="dr-${k}">${lbl}</label><div class="ctl"><button data-step="${k}" data-v="-${stp}" aria-label="Less">−</button>
    <input type="number" inputmode="decimal" id="dr-${k}" data-draft="${k}" value="${val==null?'':val}"><button data-step="${k}" data-v="${stp}" aria-label="More">+</button></div></div>`;
  const wStep=U()==='lb'?5:(x.per?2:2.5);
  let inputs='';
  if(x.t==='wr') inputs=stepper('w',`Weight (${U()}${x.per?' per hand':''})`,toDisp(dr.w),wStep)+stepper('r','Reps',dr.r,1);
  else if(x.t==='bw') inputs=stepper('r','Reps',dr.r,1)+(c.b.role==='warm'?'':stepper('w',`Added (${U()})`,toDisp(dr.w),wStep));
  else inputs=stepper('t','Seconds',dr.t,5)+(x.std?stepper('w',`Weight (${U()}${x.per?' per hand':''})`,toDisp(dr.w),wStep):'')+
    `<div class="stepper"><span class="field">Timer</span><div class="ctl">${A.work?`<b class="mono" style="font-size:28px" id="workClock"></b>`:`<button class="btn" style="width:auto;height:44px;padding:0 16px;font-size:15px" data-act="workStart">Start ${d.secs}s</button>`}</div></div>`;
  const upcoming=[]; for(let j=A.k+1;j<A.steps.length&&upcoming.length<3;j++){if(!isOpen(j)) continue; const n=curItem(j).x.n; if(n!==x.n&&!upcoming.includes(n)) upcoming.push(n)}
  return `<div class="stack">${bar}<section class="runcard">
    <div class="row" style="justify-content:space-between"><span class="role ${c.b.role}">${esc(label)}</span><span class="small muted">${setN}</span></div>
    <div class="runhead"><span class="figbox">${figure(x)}</span><button class="big-name" data-open="${x.id}">${esc(x.n)}</button></div>
    <div class="target">Target: ${esc(target)}${x.per&&x.t==='wr'?' <span class="small muted">(weight per hand)</span>':''}</div>
    ${sg.note&&c.b.role!=='warm'?`<p class="small muted">${esc(sg.note)}</p>`:''}
    <div class="steppers">${inputs}</div>
    ${c.b.role==='warm'?(prev.length?`<div class="setlog">${prev.map((l,i)=>`<span>${esc(setTxt(x,l))}</span>`).join('')}</div>`:''):runSets(c,x,sg)}
    <ul class="cues small">${x.c.map(q=>`<li>${esc(q)}</li>`).join('')}</ul>
    <button class="btn primary done-set" data-act="done">Done${c.b.role==='warm'?'':' set'}</button>
    <div class="row"><button class="btn sm" data-act="swapRun">Swap exercise</button>${prev.length?'':`<button class="btn sm ghost" data-act="rmRun">Remove</button>`}<button class="btn sm ghost" data-act="skipEx">Skip exercise</button>${doneN?`<button class="btn sm ghost" data-act="undo">Undo last set</button>`:''}</div>
    ${upcoming.length?`<p class="upnext">Up next: ${esc(upcoming.join(' · '))}</p>`:''}
  </section></div>`;
}

// Every set of the current exercise: done, now, skipped or still to do. Tap one to do it (or redo it) next.
function runSets(c,x,sg){
  const A=active, e=exList().find(o=>o.b===c.st.b&&o.i===c.st.i), maxLogged=Math.max(0,...e.steps.filter(j=>A.log[j]).map(j=>A.steps[j].s+1));
  const ss=c.b.items.length>1, n=c.it.d.sets;
  const rows=e.steps.map(j=>{const l=A.log[j], st=A.steps[j], now=j===A.k;
    const txt=l?(x.t==='wr'?targetTxt(x,c.it.d,l):setTxt(x,l)):now&&A.draft?targetTxt(x,c.it.d,{w:A.draft.w,r:A.draft.r,t:A.draft.t}):targetTxt(x,c.it.d,sg);
    return `<button class="setrow${now?' now':''}${l?' done':''}${st.skip&&!l?' skipped':''}" data-goset="${j}"><i>Set ${st.s+1}</i><span class="mono">${esc(txt)}</span><em>${l?'✓':now?'Now':st.skip?'Skipped':''}</em></button>`}).join('');
  return `<div class="setlist">${rows}</div>
    <div class="row setedit"><button class="btn sm" data-rsets="${c.st.b}" data-v="1"${n>=10?' disabled':''}>+ Add ${ss?'a round':'a set'}</button>
    ${n>Math.max(1,maxLogged)?`<button class="btn sm ghost" data-rsets="${c.st.b}" data-v="-1">Remove last ${ss?'round':'set'}</button>`:''}</div>`;
}

/* ----- Progress ----- */
function viewProgress(){
  const S=state.sessions, now=Date.now(), wk=S.filter(s=>now-new Date(s.ts).getTime()<7*DAY);
  const mins=wk.reduce((t,s)=>t+(s.end?(new Date(s.end)-new Date(s.ts))/60000:0),0);
  const recent=S.slice(-8), rn=recent.reduce((t,s)=>t+(s.rest?s.rest.n:0),0), rok=recent.reduce((t,s)=>t+(s.rest?s.rest.ok:0),0);
  const avgOver=rn?Math.round(recent.reduce((t,s)=>t+(s.rest?s.rest.over:0),0)/rn):0;
  const stats=[[wk.length,'Workouts this week'],[Math.round(mins)+' min','Time this week'],[wk.reduce((t,s)=>t+s.entries.reduce((u,e)=>u+e.sets.length,0),0),'Sets this week'],[rn?Math.round(rok/rn*100)+'%':'–','Rests on time']];
  const ps=patternScores();
  const pbars=SCORED.map(p=>{const o=ps[p], lv=o.ex?levelOf(o.score):-1, pct=Math.min(100,o.score/1.2*100);
    return `<div class="barrow"><span class="lbl">${esc(PAT[p])}</span><div class="meter"><i class="l${Math.max(0,lv)}" style="width:${o.ex?Math.max(3,pct):0}%"></i></div>
      <span class="val muted">${o.ex?`<b style="color:var(--ink)">${LEVELS[lv].n}</b> · ${esc(o.ex.n)}`:'Not tested yet'}</span></div>`}).join('');
  // sets per muscle this week; primary muscle counts 1, others half
  const ms={}; wk.forEach(s=>s.entries.forEach(e=>{const x=BYID[e.ex]; if(!x||x.p==='mob') return; x.m.forEach((m,i)=>ms[m]=(ms[m]||0)+e.sets.length*(i?.5:1))}));
  const pri=state.profile.muscles, maxM=Math.max(16,...Object.values(ms));
  const mbars=Object.keys(MUS).map(m=>{const v=ms[m]||0, goal=pri.includes(m)?12:8;
    return `<div class="barrow"><span class="lbl">${esc(MUS[m])}${pri.includes(m)?' <span style="color:var(--accent)">★</span>':''}</span><div class="meter mbar"><i style="width:${v/maxM*100}%"></i><span class="goal" style="left:${goal/maxM*100}%"></span></div>
      <span class="val muted mono">${Math.round(v*10)/10} / ${goal} sets</span></div>`}).join('');
  const done=[...new Set(S.flatMap(s=>s.entries.map(e=>e.ex)))].filter(id=>BYID[id]);
  if(!chartEx||!done.includes(chartEx)) chartEx=done.find(id=>BYID[id].std)||done[0]||null;
  const hist=[...S].reverse().slice(0,30).map(s=>{
    const mins=s.end?Math.round((new Date(s.end)-new Date(s.ts))/60000):null;
    return `<div class="entry"><div><b>${esc(s.tpl||FOCUS_NAME[s.focus]||'Workout')}</b> <span class="meta">${fmtDate(s.ts)}${mins!=null?' · '+mins+' min':''}${s.rest&&s.rest.n?` · rests on time ${s.rest.ok}/${s.rest.n}`:''}</span>
      <div class="small muted">${s.entries.map(e=>{const x=BYID[e.ex];return x?`${esc(x.n)} ${e.sets.map(st=>esc(setTxt(x,st))).join(', ')}`:''}).filter(Boolean).join(' · ')}</div></div>
      <div>${pendingDelete===s.id?`<button class="btn sm danger" data-del="${s.id}">Delete</button> <button class="btn sm ghost" data-delcancel="1">Keep</button>`:`<button class="btn sm ghost" data-delask="${s.id}" aria-label="Delete workout">✕</button>`}</div></div>`}).join('');
  return `<div class="stack">
    <h2>Progress</h2>
    <section class="panel"><div class="stats">${stats.map(([b,s])=>`<div class="stat"><b>${b}</b><span>${s}</span></div>`).join('')}</div>
      ${rn?`<p class="small muted" style="margin-top:10px">Over your last ${recent.length} workouts you went over the rest timer by ${avgOver}s per rest on average. On time means within 15 seconds.</p>`:''}</section>
    <section class="panel stack"><div><h3>Movement strength</h3><p class="small muted">Your best set in each movement over the last 4 months, compared with bodyweight. Strong means roughly a 1.5× bodyweight squat, 2× deadlift, 1.25× bench, or 10+ strict pull-ups.</p></div>
      <div class="bars">${pbars}</div></section>
    <section class="panel stack"><div><h3>Sets per muscle this week</h3><p class="small muted">The line is a weekly target: 12 sets for muscles you starred under Gear &amp; goals, 8 for the rest.</p></div><div class="bars">${mbars}</div></section>
    <section class="panel stack"><div class="row" style="justify-content:space-between"><h3>Exercise trend</h3>
      ${done.length?`<select data-chart="1">${opt(done.map(id=>[id,BYID[id].n]),chartEx)}</select>`:''}</div>
      ${chartEx?chartHtml(chartEx):'<p class="empty">Log a workout to see trends.</p>'}</section>
    <section class="panel"><h3>History</h3>${hist||'<p class="empty">No workouts yet.</p>'}</section>
  </div>`;
}
function chartHtml(id){
  const x=BYID[id], h=exHistory(id); if(!h.length) return '';
  const m=metric(x,h[0].best), conv=v=>m.u==='kg'?toDisp(v):Math.round(v), unit=m.u==='kg'?U():m.u;
  const pts=h.map(o=>({t:new Date(o.ts).getTime(),v:conv(o.v),best:o.best}));
  const W=Math.max(300,Math.min(900,(document.getElementById('main').clientWidth||640)-66)),H=Math.round(Math.min(260,Math.max(180,W*.4))),L=44,R=12,T=14,B=28;
  chartW=W;
  const t0=pts[0].t,t1=pts[pts.length-1].t||t0+1, vs=pts.map(p=>p.v), lo0=Math.min(...vs), hi0=Math.max(...vs);
  const pad=(hi0-lo0)*.15||Math.max(1,hi0*.1), lo=Math.max(0,Math.floor(lo0-pad)), hi=Math.ceil(hi0+pad);
  const X=t=>pts.length===1?L+(W-L-R)/2:L+(t-t0)/(t1-t0||1)*(W-L-R), Y=v=>T+(1-(v-lo)/(hi-lo||1))*(H-T-B);
  const ticks=[0,.5,1].map(f=>Math.round(lo+(hi-lo)*f));
  const best=h.reduce((a,b)=>b.v>a.v?b:a);
  chartPts=pts.map(p=>({x:X(p.t),y:Y(p.v),lbl:`${fmtDate(p.t)} · ${p.v} ${unit}`,sub:setTxt(x,p.best)}));
  return `<p class="small muted">${esc(m.lbl)} per workout. Best: <b>${conv(best.v)} ${unit}</b> (${esc(setTxt(x,best.best))}, ${fmtDate(best.ts)}).</p>
  <div class="chart" id="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(x.n)} ${esc(m.lbl)} over time">
    ${ticks.map(v=>`<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="axis" x="${L-6}" y="${Y(v)+4}" text-anchor="end">${v}</text>`).join('')}
    <text class="axis" x="${L}" y="${H-6}">${fmtDate(t0)}</text>${pts.length>1?`<text class="axis" x="${W-R}" y="${H-6}" text-anchor="end">${fmtDate(t1)}</text>`:''}
    ${pts.length>1?`<polyline class="line" points="${pts.map(p=>X(p.t)+','+Y(p.v)).join(' ')}"/>`:''}
    ${pts.map(p=>`<circle class="dot" cx="${X(p.t)}" cy="${Y(p.v)}" r="5"/>`).join('')}
    <line class="cross" id="cross" y1="${T}" y2="${H-B}" x1="0" x2="0" visibility="hidden"/>
    <rect x="${L}" y="0" width="${W-L-R}" height="${H}" fill="transparent" id="chartHit"/>
  </svg><div class="tip" id="tip" hidden></div></div>`;
}
let chartPts=[], chartW=600;
function wireChart(){
  const hit=document.getElementById('chartHit'); if(!hit) return;
  const svg=hit.ownerSVGElement, tip=document.getElementById('tip'), cross=document.getElementById('cross'), box=document.getElementById('chart');
  const move=e=>{const r=svg.getBoundingClientRect(), k=chartW/r.width, mx=(e.clientX-r.left)*k;
    let best=chartPts[0]; chartPts.forEach(p=>{if(Math.abs(p.x-mx)<Math.abs(best.x-mx))best=p});
    cross.setAttribute('x1',best.x);cross.setAttribute('x2',best.x);cross.setAttribute('visibility','visible');
    tip.hidden=false; tip.innerHTML=`<b>${esc(best.lbl)}</b><br>${esc(best.sub)}`;
    tip.style.left=Math.min(Math.max(best.x/k,70),r.width-70)+'px'; tip.style.top=(best.y/k)+'px'};
  hit.addEventListener('pointermove',move); hit.addEventListener('pointerdown',move);
  hit.addEventListener('pointerleave',()=>{tip.hidden=true;cross.setAttribute('visibility','hidden')});
}

    <p class="small"><b>${F.groups.length} workouts</b> and ${F.setCount} sets from ${fmtDate(F.groups[0].first)} to ${fmtDate(F.groups[F.groups.length-1].first)}.
      ${names.length-unmatched.length} of ${names.length} exercises matched this app’s library.${fresh<F.groups.length?` ${F.groups.length-fresh} workouts were imported before and will be skipped.`:''}</p>
    ${unmatched.length?`<p class="small muted">Choose what each of these should become. Anything left on “Add as my own exercise” is added to your exercise list.</p>
      <div class="stack" style="gap:6px">${unmatched.map(([n,o])=>`<label class="row small" style="justify-content:space-between"><span><b>${esc(n)}</b> <span class="muted">${o.n} sets</span></span>
        <select data-fbmap="${esc(n)}" style="max-width:220px">${opt(exOpts,o.map||'new')}</select></label>`).join('')}</div>`:''}
    <div class="row"><button class="btn sm primary" data-act="fbImport"${fresh?'':' disabled'}>Import ${fresh} workouts</button><button class="btn sm ghost" data-act="fbCancel">Cancel</button></div></div>`;
}
const fbId=g=>'fb'+Math.floor(hash(g.first.toISOString())*1e9).toString(36);
function applyFitbod(){
  const F=fitbodImport, p=state.profile; p.customEx=p.customEx||[];
  Object.entries(F.names).forEach(([n,o])=>{
    if(o.id) return;
    if(o.map&&o.map!=='new'){o.id=o.map;return}
    const pat=guessPattern(n), [pp,sub]=pat.split('.');
    const c={id:'cx'+uid6(),n,p:pp,t:o.reps?(o.w?'wr':'bw'):'time',m:PAT_MUS[pp]||['abs'],eq:[],c:[]};
    if(sub) c.sub=sub;
    p.customEx.push(c); o.id=c.id;
  });
  rebuildLibrary();
  const have=new Set(state.sessions.map(s=>s.id)); let added=0;
  F.groups.forEach(g=>{
    const id=fbId(g); if(have.has(id)) return;
    const by=new Map();
    g.sets.forEach(s=>{const ex=F.names[s.name].id; if(!by.has(ex)) by.set(ex,[]); by.get(ex).push(BYID[ex]&&BYID[ex].t==='time'?{w:s.w||null,r:null,t:s.t||null}:{w:s.w||null,r:s.reps||null,t:s.t||null})});
    const entries=[...by.entries()].map(([ex,sets])=>({ex,sets}));
    const pats=new Set(entries.map(e=>BYID[e.ex]&&BYID[e.ex].p)), up=['hpush','vpush','hpull','vpull','arms'].some(k=>pats.has(k)), low=['squat','hinge','single'].some(k=>pats.has(k));
    const end=new Date(Math.max(g.last.getTime(),g.first.getTime()+g.sets.length*2.5*60000));
    state.sessions.push({id,ts:g.first.toISOString(),end:end.toISOString(),focus:up&&low?'full':up?'upper':low?'lower':'full',entries,src:'fitbod'});
    added++;
  });
  state.sessions.sort((a,b)=>a.ts<b.ts?-1:1);
  p.examples=false; saveProfile(); planCache=null; fitbodImport=null;
  return added;
}

/* ---------------- Events ---------------- */
function toast(t){const h=document.getElementById('toastHost');h.innerHTML=`<div class="toast" role="status">${esc(t)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>h.innerHTML='',2600)}
const toggle=(arr,v)=>{const i=arr.indexOf(v);i>=0?arr.splice(i,1):arr.push(v)};
/* ----- Drag to reorder blocks (plan and workout list). Works with mouse, touch and keyboard. ----- */
function dropBlock(kind,from,to){
  if(kind==='plan'&&planCache){if(moveBlockTo(planCache,from,to)){persist();render()}}
  else if(kind==='run'&&active) editActive(pl=>moveBlockTo(pl,from,to));
}
let drag=null;
document.addEventListener('pointerdown',e=>{
  const g=e.target.closest('[data-grip]'); if(!g||e.button>0) return;
  const item=g.closest('[data-dragitem]'), list=item&&item.closest('[data-dragkind]'); if(!list) return;
  e.preventDefault(); g.setPointerCapture(e.pointerId);
  const sc=item.closest('.drawer')||document.scrollingElement, top=()=>sc.scrollTop;
  const items=[...list.querySelectorAll('[data-dragitem]')].filter(el=>el.closest('[data-dragkind]')===list);
  const boxes=items.map(el=>{const r=el.getBoundingClientRect();return {el,i:+el.dataset.dragitem,top:r.top+top(),h:r.height}});
  const me=boxes.find(o=>o.el===item), gap=boxes.length>1?Math.abs(boxes[1].top-boxes[0].top-boxes[0].h):8;
  drag={g,item,list,kind:list.dataset.dragkind,sc,top,boxes,me,gap,y0:e.clientY+top(),y:e.clientY,to:me.i,raf:0};
  item.classList.add('dragging'); document.body.classList.add('is-dragging');
  const loop=()=>{ if(!drag) return; const r=sc===document.scrollingElement?{top:0,bottom:innerHeight}:sc.getBoundingClientRect();
    const v=drag.y<r.top+70?-10:drag.y>r.bottom-70?10:0; if(v){sc.scrollTop+=v; place()} drag.raf=requestAnimationFrame(loop)};
  drag.raf=requestAnimationFrame(loop);
});
function place(){
  const D=drag, y=D.y+D.top(), dy=y-D.y0, mid=D.me.top+D.me.h/2+dy;
  let to=D.me.i;
  D.boxes.forEach(o=>{ if(o===D.me) return; const c=o.top+o.h/2; if(o.i>D.me.i&&mid>c) to=Math.max(to,o.i); if(o.i<D.me.i&&mid<c) to=Math.min(to,o.i) });
  D.to=to; D.item.style.transform=`translateY(${dy}px)`;
  const shift=D.me.h+D.gap;
  D.boxes.forEach(o=>{ if(o===D.me) return; o.el.style.transform=o.i>D.me.i&&o.i<=to?`translateY(${-shift}px)`:o.i<D.me.i&&o.i>=to?`translateY(${shift}px)`:'' });
}
document.addEventListener('pointermove',e=>{if(!drag) return; drag.y=e.clientY; place()});
function endDrag(commit){
  const D=drag; if(!D) return; drag=null; cancelAnimationFrame(D.raf);
  document.body.classList.remove('is-dragging'); D.item.classList.remove('dragging'); D.boxes.forEach(o=>o.el.style.transform='');
  if(commit&&D.to!==D.me.i) dropBlock(D.kind,D.me.i,D.to);
}
document.addEventListener('pointerup',()=>endDrag(true));
document.addEventListener('pointercancel',()=>endDrag(false));
document.addEventListener('keydown',e=>{
  const g=e.target.closest&&e.target.closest('[data-grip]'); if(!g||!['ArrowUp','ArrowDown'].includes(e.key)) return;
  const item=g.closest('[data-dragitem]'), list=item.closest('[data-dragkind]'), from=+item.dataset.dragitem, to=from+(e.key==='ArrowUp'?-1:1), kind=list.dataset.dragkind;
  e.preventDefault(); dropBlock(kind,from,to);
  const again=document.querySelector(`[data-dragkind="${kind}"] [data-dragitem="${to}"] [data-grip]`); if(again) again.focus();
});

document.addEventListener('click',async e=>{
  const t=e.target.closest('button,[data-open],[data-close]'); if(!t) return;
  const d=t.dataset, p=state.profile;
  if(d.tab){tab=d.tab;selected=null;pendingDelete=null;try{sessionStorage.setItem('fc.tab',tab)}catch(_){};render();window.scrollTo(0,0);return}
  if(d.close){selected=null;render();return}
  if(d.open){selected=d.open;detailAt=d.at||null;render();return}
  if(d.goex){const [b,i]=d.goex.split(':').map(Number); goExercise(b,i); return}
  if(d.goset&&active){goSet(+d.goset); return}
  if(d.psets&&planCache){const b=planCache.blocks[+d.psets]; if(b&&setCount(planCache,+d.psets,b.items[0].d.sets+(+d.v))){persist();render()} return}
  if(d.rsets&&active){const bi=+d.rsets, b=active.plan.blocks[bi], n=b.items[0].d.sets+(+d.v),
    logged=Math.max(0,...active.steps.filter((st,j)=>st.b===bi&&active.log[j]).map(st=>st.s+1)); if(n<logged) return;
    editActive(pl=>setCount(pl,bi,n)); return}
  if(d.swap){const [bi,ii]=d.swap.split(':').map(Number); openPick({mode:'swap',where:'plan',b:bi,i:ii}); return}
  if(d.rmitem&&planCache){const [bi,ii]=d.rmitem.split(':').map(Number), x=BYID[planCache.blocks[bi].items[ii].ex]; if(removeItem(planCache,bi,ii)){persist();toast(`Removed ${x.n}`);render()} return}
  if(d.tpluse){useTemplate(d.tpluse); selected=null; render(); window.scrollTo(0,0); return}
  if(d.tpldel){const p2=state.profile; p2.templates=(p2.templates||[]).filter(t=>t.id!==d.tpldel); pendingDelete=null; touchProfile(); render(); return}
  if(d.pick&&picker){applyPick(d.pick); return}
  if(d.pickall&&picker){picker.all=d.pickall==='1'; render(); return}
  if(d.fav){toggle(p.favorites,d.fav);touchProfile();render();return}
  if(d.eq){toggle(p.equipment,d.eq);touchProfile();render();return}
  if(d.rmeq){p.customEq=p.customEq.filter(x=>x.id!==d.rmeq);touchProfile();render();return}
  if(d.sport){toggle(p.sports,d.sport);if(!p.sports.includes(p.ctx.sport))p.ctx.sport='all';touchProfile();render();return}
  if(d.mus){toggle(p.muscles,d.mus);touchProfile();render();return}
  if(d.units){p.units=d.units;saveProfile();render();return}
  if(d.exshow){exShow=d.exshow;render();return}
  if(d.step&&active&&active.draft){const k=d.step, cur=k==='w'?toDisp(active.draft.w)||0:+(active.draft[k]||0), v=Math.max(0,Math.round((cur+(+d.v))*2)/2);
    active.draft[k]=k==='w'?fromDisp(v):v; saveActive(); const el=document.getElementById('dr-'+k); if(el) el.value=k==='w'?toDisp(active.draft.w):v; return}
  if(d.delask){pendingDelete=d.delask;render();return}
  if(d.delcancel){pendingDelete=null;render();return}
  if(d.del){state.sessions=state.sessions.filter(s=>s.id!==d.del);state.deleted.push(d.del);pendingDelete=null;persist();toast('Workout deleted');render();return}
  if(d.rmex){p.customEx=p.customEx.filter(c=>c.id!==d.rmex);p.favorites=p.favorites.filter(f=>f!==d.rmex);selected=null;touchProfile();rebuildLibrary();render();return}
  switch(d.act){
    case 'fbCancel': fitbodImport=null; render(); return;
    case 'fbImport': {const n=applyFitbod(); toast(`Imported ${n} workouts from Fitbod`); render(); return}
    case 'start': startWorkout(); return;
    case 'exPrev': stepExercise(-1); return;
    case 'exNext': stepExercise(1); return;
    case 'exList': selected='runlist'; render(); return;
    case 'signin': boot(true); return;
    case 'demo': mode='demo'; render(); return;
    case 'driveSave': store.flush(); return;
    case 'signOut': store.signOut(); useData({}); active=null; pendingDelete=null; mode='signin'; keepAwake(false); render(); return;
    case 'shuffle': reshuffle(); return;
    case 'dismissSum': lastSummary=null; render(); return;
    case 'done': audio(); doneSet(); return;
    case 'startSet': startSet(); return;
    case 'restAdj': if(active&&active.rest){active.rest.plan=Math.max(5,active.rest.plan+(+d.v)); if(active.rest.plan-(Date.now()-active.rest.start)/1000>0){active.rest.beeped=false} saveActive(); tick()} return;
    case 'undo': undoSet(); return;
    case 'skipEx': skipExercise(); return;
    case 'swapRun': {const c=curItem(); if(c) openPick({mode:'swap',where:'run',b:c.st.b,i:c.st.i}); return}
    case 'rmRun': {const c=curItem(); if(!c||loggedFor(c.it.ex).length) return; const n=c.x.n; editActive(pl=>removeItem(pl,c.st.b,c.st.i)); toast(`Removed ${n}`); return}
    case 'templates': selected='templates'; render(); return;
    case 'tplSave': {const n=(document.getElementById('tplName').value||'').trim(); if(!n){toast('Give the template a name');return} saveTemplate(n); selected=null; toast(`Saved template “${n}”`); render(); return}
    case 'addEx': openPick({mode:'add',where:'plan'}); return;
    case 'addExRun': openPick({mode:'add',where:'run'}); return;
    case 'workStart': audio(); active.work=Date.now(); active.workBeeped=false; render(); return;
    case 'endAsk': pendingDelete='END'; render(); return;
    case 'endCancel': pendingDelete=null; render(); return;
    case 'endSave': finishWorkout(true); return;
    case 'endDiscard': finishWorkout(false); toast('Workout discarded'); return;
    case 'addEq': {const el=document.getElementById('newEq'), n=(el.value||'').trim(); if(!n) return; p.customEq=p.customEq||[]; p.customEq.push({id:'eq'+uid6(),n}); touchProfile(); render(); return}
    case 'saveEx': {
      const n=(document.getElementById('nx-n').value||'').trim(); if(!n){toast('Give it a name');return}
      const m=[...document.querySelectorAll('[data-nxm]:checked')].map(i=>i.dataset.nxm), eq=[...document.querySelectorAll('[data-nxe]:checked')].map(i=>i.dataset.nxe);
      const c={id:'cx'+uid6(),n,p:document.getElementById('nx-p').value,t:document.getElementById('nx-t').value,m,eq,c:document.getElementById('nx-c').value.split('\n').map(s=>s.trim()).filter(Boolean)};
      p.customEx=p.customEx||[]; p.customEx.push(c); p.favorites.push(c.id); touchProfile(); rebuildLibrary(); selected=c.id; toast('Added to your exercises and favorites'); render(); return}
    case 'sound': p.sound=!p.sound; saveProfile(); render(); if(p.sound) beep(); return;
    case 'resetAsk': pendingDelete='ALL'; render(); return;
    case 'resetYes': state={profile:defaultProfile(),sessions:[],deleted:state.deleted.concat(state.sessions.map(s=>s.id))}; active=null; pendingDelete=null; planCache=null; saveProfile(); rebuildLibrary(); toast('Everything erased'); render(); return;
    case 'export': {
      const data=JSON.stringify({app:'fitness-coach',exported:new Date().toISOString(),...state},null,2);
      try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download='fitness-coach-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();toast('Backup downloaded')}
      catch(_){try{await navigator.clipboard.writeText(data);toast('Backup copied to clipboard')}catch(__){toast('Export isn’t available here')}}
      return}
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&selected){selected=null;render()}});
document.addEventListener('input',e=>{
  const t=e.target, d=t.dataset;
  if(d.pickq&&picker){picker.q=t.value; const el=document.getElementById('picklist'); if(el) el.innerHTML=pickRows(); return}
  if(d.draft&&active&&active.draft){const v=t.value===''?null:+t.value; active.draft[d.draft]=d.draft==='w'?fromDisp(v):v; saveActive(); return}
  if(d.balance){const a=+t.value; document.getElementById('mixTxt').textContent=a<=35?'Plans lean toward muscle and shape.':a>=65?'Plans lean toward performance and sport.':'A mix of strength, power and physique work.'}
});
document.addEventListener('change',async e=>{
  const t=e.target, d=t.dataset, p=state.profile;
  if(d.ctx){p.ctx[d.ctx]=d.ctx==='minutes'?+t.value:t.value;saveProfile();render();return}
  if(d.rest){p.rest[d.rest]=+t.value;saveProfile();return}
  if(d.balance){p.balance=+t.value;touchProfile();render();return}
  if(d.bw){const v=fromDisp(t.value); if(v&&v>20&&v<400){p.bw=v;saveProfile()} else toast('Enter your bodyweight');return}
  if(d.exfilter){exFilter=t.value;render();return}
  if(d.chart){chartEx=t.value;render();return}
  if(d.fbmap&&fitbodImport){fitbodImport.names[d.fbmap].map=t.value;return}
  if(t.id==='fitbodFile'&&t.files[0]){
    try{fitbodImport=readFitbod(await t.files[0].text())}
    catch(err){toast(err.message==='columns'?'That file doesn’t have Date and Exercise columns. Is it the Fitbod CSV export?':'No sets found in that file.')}
    render(); return}
  if(t.id==='importFile'&&t.files[0]){
    try{const j=JSON.parse(await t.files[0].text()); if(!j.profile||!Array.isArray(j.sessions)) throw 0;
      const have=new Set(state.sessions.map(s=>s.id)), add=j.sessions.filter(s=>s&&s.id&&Array.isArray(s.entries)&&!have.has(s.id));
      state.profile=fixProfile(j.profile); state.sessions=state.sessions.concat(add).sort((a,b)=>a.ts<b.ts?-1:1);
      saveProfile(); rebuildLibrary(); planCache=null; persist(); toast(`Imported ${add.length} workouts`); render();
    }catch(_){toast('That file isn’t a Fitness Coach backup.')}
  }
});

boot(false);
// pick up changes made on another device when the app comes back to the front
document.addEventListener('visibilitychange',async()=>{
  if(document.visibilityState!=='visible'||mode!=='ready') return;
  if(active) return keepAwake(true);
  if(await store.refresh()){useData(store.data); render()}
});
if('serviceWorker' in navigator&&/^(petravanta\.github\.io|localhost)$/.test(location.hostname)) navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
