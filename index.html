<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fitness Coach</title>
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#172129" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fitness">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* ===== Shared look: Skating Mentor · Fitness Coach =====
   Same tokens, type and components across petravanta's apps. Each app only changes the four --accent values below. */
:root{
  --bg:#eef2f4; --surface:#ffffff; --sunk:#e3e9ec; --line:#cdd6db; --ink:#14212a; --muted:#566771; --faint:#8a99a2;
  --lv-new:#9aa8b0; --lv-learn:#c07a00; --lv-dev:#2f6fd0; --lv-conf:#11897a; --lv-solid:#0c5e3e;
  --lv-learn-bg:#fbefd9; --lv-dev-bg:#e1ebfa; --lv-conf-bg:#d9f1ec; --lv-solid-bg:#d5eadf;
  --danger:#b3261e; --danger-soft:#fbe3e1;
  --f-display:"Unbounded","Arial Rounded MT Bold",system-ui,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f161b; --surface:#172129; --sunk:#111a20; --line:#2a3842; --ink:#e4ecf0; --muted:#9fb0ba; --faint:#6b7d88;
  --lv-new:#64757f; --lv-learn:#e6a33a; --lv-dev:#6ea0f0; --lv-conf:#3cc3ad; --lv-solid:#6fd39a;
  --lv-learn-bg:#3a2a10; --lv-dev-bg:#182a45; --lv-conf-bg:#0f3530; --lv-solid-bg:#143224;
  --danger:#ff8a80; --danger-soft:#3d1c1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161b; --surface:#172129; --sunk:#111a20; --line:#2a3842; --ink:#e4ecf0; --muted:#9fb0ba; --faint:#6b7d88;
  --lv-new:#64757f; --lv-learn:#e6a33a; --lv-dev:#6ea0f0; --lv-conf:#3cc3ad; --lv-solid:#6fd39a;
  --lv-learn-bg:#3a2a10; --lv-dev-bg:#182a45; --lv-conf-bg:#0f3530; --lv-solid-bg:#143224;
  --danger:#ff8a80; --danger-soft:#3d1c1a; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar{display:flex;align-items:center;gap:16px;padding-block:12px 0;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.brand svg{width:26px;height:26px;flex:none}
.save-state{margin-left:auto;font-size:12px;color:var(--muted);font-family:var(--f-mono)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-top:8px;scrollbar-width:none}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px 9px;font-weight:600;color:var(--muted);white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
main{padding-block:20px 80px}
h2{font-family:var(--f-display);font-weight:500;font-size:20px;letter-spacing:-.01em;margin:0;text-wrap:balance}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none}
.btn.danger{color:var(--danger)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.big{padding:12px 22px;font-size:16px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
label.field{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
select,input[type=text],input[type=number],textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:15px;text-transform:none;letter-spacing:0;font-weight:500;min-width:0}
textarea{resize:vertical}
.ctx{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:end}
@media (max-width:720px){.ctx{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ctx-note{font-size:13px;color:var(--muted);margin-top:10px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.pill.l1{background:var(--lv-learn-bg);color:var(--lv-learn)}
.pill.l2{background:var(--lv-dev-bg);color:var(--lv-dev)}
.pill.l3{background:var(--lv-conf-bg);color:var(--lv-conf)}
.pill.l4{background:var(--lv-solid-bg);color:var(--lv-solid)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:720px){.two{grid-template-columns:minmax(0,1fr)}}
.banner{background:var(--accent-soft);border-radius:var(--r);padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner p{flex:1 1 260px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:620px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat b{display:block;font-family:var(--f-mono);font-size:24px;font-weight:500}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.meter{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.scrim{position:fixed;inset:0;background:rgba(10,16,20,.35);z-index:40}
.drawer{position:fixed;z-index:41;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);border-left:1px solid var(--line);overflow-y:auto;
  padding:calc(env(safe-area-inset-top,0px) + 18px) max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) 18px;display:flex;flex-direction:column;gap:16px}
@media (max-width:640px){.drawer{top:auto;left:0;width:100%;max-height:86vh;border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;padding-left:max(18px,env(safe-area-inset-left,0px))}}
.drawer .x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:max(12px,env(safe-area-inset-right,0px));background:var(--sunk);border:0;border-radius:999px;width:32px;height:32px;font-size:18px;line-height:1}
@media (max-width:640px){.drawer .x{top:12px}}
.drawer h2{padding-right:40px}
.drawer ul,.cues{margin:0;padding-left:18px}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:inline-flex;align-items:center;gap:5px;font-size:13px;border:1px solid var(--line);border-radius:6px;padding:3px 8px;background:var(--sunk)}
.entry{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:8px 0;border-top:1px solid var(--line)}
.entry .meta{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:60;max-width:calc(100% - 32px)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.4}}}
/* ===== end shared look ===== */

/* Fitness Coach accent */
:root{--accent:#4f46c8;--accent-ink:#ffffff;--accent-soft:#e6e4fb}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--accent:#9d95ff;--accent-ink:#120f33;--accent-soft:#25224d}}
:root[data-theme="dark"]{--accent:#9d95ff;--accent-ink:#120f33;--accent-soft:#25224d}

/* Layout: plan is a column of blocks (a block is one exercise or a superset); the workout runner replaces the plan with one big card at a time (set, then rest timer). */
.plan{display:flex;flex-direction:column;gap:12px}
.block{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;grid-template-columns:52px minmax(0,1fr);gap:4px 14px}
.block .slot{grid-row:1/span 2;text-align:center;padding-top:2px}
.block .slot b{display:block;font-family:var(--f-mono);font-size:18px;font-weight:500}
.block .slot span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.role{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.role.warm{color:var(--lv-dev)} .role.power{color:var(--lv-learn)} .role.sport{color:var(--lv-conf)} .role.cond{color:var(--muted)}
.exl{display:flex;flex-direction:column;gap:10px}
.ex{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 10px;align-items:start}
.ex .tag{font-family:var(--f-mono);font-size:12px;color:var(--faint);padding-top:3px;min-width:20px}
.ex .name{font-weight:700;font-size:16px;background:none;border:0;padding:0;text-align:left;color:var(--ink)}
.ex .name:hover{text-decoration:underline;text-decoration-color:var(--accent)}
.ex .dose{grid-column:2;font-size:14px}
.ex .sug{grid-column:2/span 2;font-size:13px;color:var(--muted)}
@media (max-width:560px){.block{grid-template-columns:minmax(0,1fr)}.block .slot{grid-row:auto;text-align:left;display:flex;gap:6px;align-items:baseline}.block .slot b{display:inline;font-size:14px}}
/* runner */
.runbar{display:flex;gap:8px 16px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.runbar b{color:var(--ink)}
.runcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px}
.runcard .big-name{font-family:var(--f-display);font-weight:500;font-size:24px;letter-spacing:-.01em;background:none;border:0;padding:0;text-align:left;color:var(--ink);line-height:1.25}
.target{font-size:16px;font-weight:600}
.steppers{display:flex;gap:16px;flex-wrap:wrap}
.stepper{display:flex;flex-direction:column;gap:6px}
.stepper .ctl{display:flex;align-items:center;gap:6px}
.stepper button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--sunk);font-size:20px;font-weight:600}
.stepper input{width:92px;text-align:center;font-family:var(--f-mono);font-size:22px;padding:8px 6px}
.done-set{width:100%;padding:16px;font-size:18px;border-radius:14px}
.rest{text-align:center;align-items:center}
.clock{font-family:var(--f-mono);font-weight:500;font-size:clamp(64px,22vw,128px);line-height:1;font-variant-numeric:tabular-nums}
.rest .meter{width:100%;height:10px}
.rest.over{border-color:var(--danger);background:var(--danger-soft)}
.rest.over .clock{color:var(--danger)}
.rest.over .meter i{background:var(--danger)}
.focus-line{font-size:15px;color:var(--muted);font-style:italic}
.next{background:var(--sunk);border-radius:10px;padding:12px 14px;text-align:left;width:100%}
.setlog{display:flex;flex-wrap:wrap;gap:6px}
.setlog span{font-family:var(--f-mono);font-size:13px;background:var(--sunk);border-radius:6px;padding:2px 8px}
.upnext{font-size:13px;color:var(--muted)}
/* progress */
.bars{display:flex;flex-direction:column;gap:10px}
.barrow{display:grid;grid-template-columns:150px minmax(0,1fr) 190px;gap:12px;align-items:center;font-size:14px}
.barrow .lbl{font-weight:600}
.barrow .val{font-size:12px;text-align:right}
@media (max-width:560px){.barrow{grid-template-columns:110px minmax(0,1fr);}.barrow .val{grid-column:2;text-align:left;margin-top:-6px}}
.barrow .meter i.l0{background:var(--lv-new)} .barrow .meter i.l1{background:var(--lv-learn)} .barrow .meter i.l2{background:var(--lv-dev)} .barrow .meter i.l3{background:var(--lv-conf)} .barrow .meter i.l4{background:var(--lv-solid)}
.mbar{position:relative}
.mbar .goal{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.5}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--muted);font-family:var(--f-mono);font-size:11px}
.chart .line{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .cross{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:8px;padding:6px 10px;font-size:12px;white-space:nowrap;transform:translate(-50%,-110%)}
.exrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.exrow:last-child{border-bottom:0}
.exrow .nm{background:none;border:0;padding:0;text-align:left;font-weight:600;color:var(--ink)}
.star{background:none;border:0;font-size:20px;line-height:1;color:var(--faint);padding:2px}
.star[aria-pressed="true"]{color:var(--accent)}
.needs{font-size:12px;color:var(--faint)}
input[type=range]{width:100%;accent-color:var(--accent)}
/* tab icons show only in the phone tab bar */
nav.tabs svg{display:none;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs .short{display:none}
button,a{touch-action:manipulation}
/* Phone: tabs become a bottom bar within thumb reach; controls get 44px touch targets */
@media (max-width:640px){
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);gap:0;justify-content:space-around;
    padding:4px max(4px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 4px) max(4px,env(safe-area-inset-left,0px))}
  nav.tabs button{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:2px;border-bottom:0;border-top:3px solid transparent;padding:6px 2px 4px;font-size:11px;min-width:0}
  nav.tabs button[aria-selected="true"]{border-top-color:var(--accent);color:var(--accent)}
  nav.tabs svg,nav.tabs .short{display:block} nav.tabs .long{display:none}
  .topbar{padding-block:10px}
  main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  .toast{bottom:calc(env(safe-area-inset-bottom,0px) + 78px)}
  .btn,.chip{min-height:40px} .btn.sm{min-height:36px} .star{min-width:40px;min-height:40px}
  select,input[type=text],input[type=number]{font-size:16px;min-height:44px}
}
/* workout navigation */
.exnav{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px}
.exnav .btn{min-height:44px}
.exnav .btn:disabled{opacity:.4;cursor:default}
.exnav-mid{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.runlist{display:flex;flex-direction:column}
.runrow{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 4px;min-height:52px}
.runrow .tag{font-family:var(--f-mono);font-size:12px;color:var(--faint)}
.runrow .nm{font-weight:600}
.runrow.cur{background:var(--accent-soft);border-radius:8px}
.runrow .ok{color:var(--lv-conf);font-weight:600}
.gate{max-width:560px;margin:8vh auto 0}
.gated nav.tabs{display:none}

</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="topbar">
      <a data-hub-link href="https://petravanta.github.io/general/">All apps</a>
      <div class="brand">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="9" width="6" height="14" rx="2" fill="var(--accent)"/><rect x="23" y="9" width="6" height="14" rx="2" fill="var(--accent)"/><rect x="9" y="14.5" width="14" height="3" rx="1.5" fill="var(--ink)"/><rect x="0.5" y="12.5" width="2.5" height="7" rx="1" fill="var(--ink)"/><rect x="29" y="12.5" width="2.5" height="7" rx="1" fill="var(--ink)"/></svg>
        Fitness Coach
      </div>
      <span class="save-state" id="saveState">Loading…</span>
      <button class="btn sm" id="driveResume" data-act="signin" data-drive="1" hidden>Reconnect Drive</button>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="today" aria-selected="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h16M8 3v4M16 3v4"/><rect x="4" y="5" width="16" height="15" rx="2"/></svg><span class="long">Today</span><span class="short">Today</span></button>
      <button role="tab" data-tab="progress" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h16"/><path d="M6 15l4-4 3 3 5-6"/></svg><span class="long">Progress</span><span class="short">Progress</span></button>
      <button role="tab" data-tab="exercises" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10v4M21 10v4M6 7v10M18 7v10M6 12h12"/></svg><span class="long">Exercises</span><span class="short">Exercises</span></button>
      <button role="tab" data-tab="gear" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg><span class="long">Gear &amp; goals</span><span class="short">Goals</span></button>
      <button role="tab" data-tab="settings" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span class="long">Settings</span><span class="short">Settings</span></button>
    </nav>
  </div>
</header>
<main class="wrap" id="main"></main>
<div id="drawerHost"></div>
<div id="toastHost"></div>

<script>
/* ---------------- Library ---------------- */
const PAT={squat:'Squat',hinge:'Hinge',single:'Single-leg',hpush:'Horizontal push',vpush:'Vertical push',hpull:'Horizontal pull',vpull:'Vertical pull',
  carry:'Carry & grip',core:'Core',power:'Power & jumps',arms:'Arms',calves:'Calves & shins',shoulder:'Shoulder health',cond:'Conditioning',mob:'Mobility'};
// Movement patterns that get a strength score on the Progress tab
const SCORED=['squat','hinge','single','hpush','vpush','hpull','vpull','carry','core'];
const MUS={chest:'Chest',shoulders:'Shoulders',back:'Back',arms:'Arms',abs:'Abs & obliques',glutes:'Glutes',quads:'Quads',hams:'Hamstrings',calves:'Calves'};
const QUAL={power:'explosive power',single:'single-leg strength',lat:'lateral movement',rot:'rotation',grip:'grip',endur:'endurance',mob:'mobility',core:'trunk stability',post:'posterior chain',shoulder:'shoulder resilience'};
const SPORTS={
  skate:{n:'Skating',q:{single:3,lat:3,post:2,core:2,power:1,mob:1}},
  run:{n:'Running',q:{single:3,post:2,power:2,endur:2,core:1}},

function suggest(x,d){

  if(!L) return {w:null,r:d.reps?d.reps[0]:null,t:d.secs||null,note:x.t==='wr'?`First time: pick a weight you could do about ${(d.reps?d.reps[1]:10)+2} times`:''};
  if(x.t==='time'){const best=Math.max(...L.sets.map(s=>s.t||0)),w=Math.max(...L.sets.map(s=>s.w||0))||null;return {w,t:best+5,note:`Last time ${best}s${w?' with '+wtxt(w):''}. Go 5s longer.`}}
  const top=Math.max(...L.sets.map(s=>s.w||0)), atTop=L.sets.filter(s=>(s.w||0)===top), minR=Math.min(...atTop.map(s=>s.r||0)), maxR=Math.max(...L.sets.map(s=>s.r||0));
  if(x.t==='bw'){
    if(d.reps&&minR>=d.reps[1]) return {w:top||null,r:d.reps[1],note:`You hit ${minR}+ every set last time. Slow the lowering or add a little weight.`};
    return {w:top||null,r:d.reps?Math.min(maxR+1,d.reps[1]):maxR+1,note:`Last time best ${maxR} reps. Aim for one more.`};
  }
  if(d.reps&&minR>=d.reps[1]) return {w:top+inc(x),r:d.reps[0],note:`You got ${minR}+ on every set at ${wtxt(top)}, so go up.`};
  if(d.reps&&minR<d.reps[0]) return {w:top,r:d.reps[0],note:`Stay at ${wtxt(top)} until every set reaches ${d.reps[0]}.`};
  return {w:top,r:Math.min(minR+1,d.reps?d.reps[1]:minR+1),note:`Last time ${atTop.length}×${minR} at ${wtxt(top)}. One more rep.`};
}
function doseTxt(x,d,rest){
  const r=rest?` · rest ${mmss(rest)}`:'';
  if(d.secs) return `${d.sets>1?d.sets+' × ':''}${d.secs}s${x.p==='mob'?' each side':''}${r}`;
  return `${d.sets} × ${d.reps[0]}–${d.reps[1]}${x.per&&x.t==='wr'?' (weight per hand)':''}${r}`;
}

/* ---------------- Workout runner ---------------- */
let lastSummary=null;
function saveActive(){if(active) active.upd=Date.now(); persist()}
function buildSteps(plan){
  const steps=[];
  plan.blocks.forEach((b,bi)=>{
    if(b.role==='warm'){b.items.forEach((it,ii)=>steps.push({b:bi,i:ii,s:0,rest:0}));return}
    const sets=b.items[0].d.sets;
    for(let s=0;s<sets;s++) b.items.forEach((it,ii)=>steps.push({b:bi,i:ii,s,rest:ii===b.items.length-1?b.rest:0}));
    const last=steps[steps.length-1]; last.rest=60; last.move=true;
  });
  if(steps.length) steps[steps.length-1].rest=0;
  return steps;
}
function startWorkout(){
  const plan=JSON.parse(JSON.stringify(getPlan()));
  active={id:uid6(),started:Date.now(),focus:plan.focus,est:plan.est,plan,steps:buildSteps(plan),k:0,phase:'set',log:{},rests:[],draft:null};
  initDraft(); saveActive(); keepAwake(true); audio(); render(); window.scrollTo(0,0);
}
// Moving around the workout: steps can be done in any order; "open" steps are neither logged nor skipped
const isOpen=j=>!active.log[j]&&!active.steps[j].skip;
function nextOpen(from){const n=active.steps.length;for(let j=from;j<n;j++)if(isOpen(j))return j;for(let j=0;j<Math.min(from,n);j++)if(isOpen(j))return j;return -1}
function exList(){const m=new Map();active.steps.forEach((s,j)=>{const key=s.b+':'+s.i;if(!m.has(key))m.set(key,{b:s.b,i:s.i,steps:[]});m.get(key).steps.push(j)});return [...m.values()]}
function exTag(b,i){const bl=active.plan.blocks[b], warm=active.plan.blocks[0].role==='warm';return bl.role==='warm'?'W'+(i+1):String.fromCharCode(65+b-(warm?1:0))+(bl.items.length>1?i+1:'')}
function goExercise(b,i){
  const js=exList().find(e=>e.b===b&&e.i===i).steps; js.forEach(j=>delete active.steps[j].skip);
  let k=js.find(j=>!active.log[j]); if(k==null) k=js[js.length-1];
  active.k=k; active.phase='set'; active.rest=null; initDraft();
  const l=active.log[k]; if(l) active.draft={w:l.w,r:l.r,t:l.t};
  selected=null; saveActive(); render(); window.scrollTo(0,0);
}
function stepExercise(dir){const L=exList(), st=active.steps[active.k]; if(!st) return; const t=L[L.findIndex(e=>e.b===st.b&&e.i===st.i)+dir]; if(t) goExercise(t.b,t.i)}
function curItem(k=active.k){const st=active.steps[k]; if(!st) return null; const b=active.plan.blocks[st.b]; return {st,b,it:b.items[st.i],x:BYID[b.items[st.i].ex]}}
function loggedFor(ex){return Object.keys(active.log).map(Number).sort((a,b)=>a-b).map(k=>active.log[k]).filter(l=>l.ex===ex)}
function initDraft(){
  const c=curItem(); if(!c){active.draft=null;return}
  const prev=loggedFor(c.it.ex).slice(-1)[0], sg=suggest(c.x,c.it.d);
  active.draft=prev?{w:prev.w,r:prev.r,t:prev.t}:{w:sg.w,r:sg.r,t:sg.t||c.it.d.secs};
  active.work=null;
}
function doneSet(){
  const c=curItem(); if(!c) return; const d=active.draft||{};
  let t=d.t; if(active.work){t=Math.round((Date.now()-active.work)/1000)}
  active.log[active.k]={ex:c.it.ex,w:d.w==null?null:+d.w,r:d.r==null?null:+d.r,t:t==null?null:+t,ts:Date.now()};
  const rest=c.st.rest, nk=nextOpen(active.k+1);
  if(nk<0){active.phase='done'}
  else{active.k=nk; if(rest>0){active.phase='rest';active.rest={start:Date.now(),plan:rest,move:!!c.st.move,beeped:false,warned:false}} else active.phase='set'}
  initDraft(); saveActive(); render(); window.scrollTo(0,0);
}
function startSet(){
  const r=active.rest; if(r&&!r.move) active.rests.push({p:r.plan,a:Math.round((Date.now()-r.start)/1000),ts:Date.now()});
  active.phase='set'; active.rest=null; saveActive(); render();
}
// Undo the most recently logged set, wherever it was
function undoSet(){
  const ks=Object.keys(active.log).map(Number); if(!ks.length) return;
  const k=ks.reduce((a,b)=>active.log[a].ts>active.log[b].ts?a:b), l=active.log[k]; delete active.log[k];
  active.rests=active.rests.filter(r=>!r.ts||r.ts<l.ts);
  active.k=k; active.phase='set'; active.rest=null; active.draft={w:l.w,r:l.r,t:l.t}; active.work=null; saveActive(); render();
}
function skipExercise(){
  const c=curItem(); if(!c) return;
  active.steps.forEach((s,j)=>{if(s.b===c.st.b&&s.i===c.st.i&&!active.log[j]) s.skip=true});
  const nk=nextOpen(active.k); if(nk<0) active.phase='done'; else {active.k=nk; active.phase='set'; active.rest=null; initDraft()}
  saveActive(); render();
}
function finishWorkout(save){
  if(save){
    const by=new Map();
    Object.keys(active.log).map(Number).sort((a,b)=>a-b).forEach(k=>{const l=active.log[k]; if(!by.has(l.ex)) by.set(l.ex,[]); by.get(l.ex).push({w:l.w,r:l.r,t:l.t})});
    const entries=[...by.entries()].map(([ex,sets])=>({ex,sets}));
    if(entries.length){
      const before={}; entries.forEach(e=>{const h=exHistory(e.ex); before[e.ex]=h.length?Math.max(...h.map(x=>x.v)):null});
      const ses={id:active.id,ts:new Date(active.started).toISOString(),end:new Date().toISOString(),focus:active.focus,entries,
        rest:{n:active.rests.length,ok:active.rests.filter(r=>r.a-r.p<=15).length,over:active.rests.reduce((t,r)=>t+Math.max(0,r.a-r.p),0)}};
      state.sessions.push(ses);
      const prs=entries.filter(e=>{const x=BYID[e.ex]; if(!x||before[e.ex]==null) return false; return Math.max(...e.sets.map(s=>metric(x,s).v))>before[e.ex]+.01}).map(e=>BYID[e.ex].n);
      const vol=entries.reduce((t,e)=>t+e.sets.reduce((u,s)=>u+(s.w||0)*(s.r||0),0),0);
      lastSummary={mins:Math.round((Date.now()-active.started)/60000),sets:entries.reduce((t,e)=>t+e.sets.length,0),vol,rest:ses.rest,prs};
    }
  }
  active=null; planCache=null; persist(); keepAwake(false); pendingDelete=null; render(); window.scrollTo(0,0);
}

let AC=null;
function audio(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended')AC.resume()}catch(e){} return AC}
function beep(f=880,ms=180,n=1){
  if(state.profile.sound){const a=audio(); if(a){for(let i=0;i<n;i++){const o=a.createOscillator(),g=a.createGain(),t0=a.currentTime+i*(ms/1000+.09);
    o.frequency.value=f;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(.3,t0+.01);g.gain.exponentialRampToValueAtTime(.0001,t0+ms/1000);o.start(t0);o.stop(t0+ms/1000+.02)}}}
  try{navigator.vibrate&&navigator.vibrate(n>1?[200,100,200]:120)}catch(e){}
}
let wake=null;
async function keepAwake(on){try{if(on&&!wake&&'wakeLock' in navigator){wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>wake=null)}if(!on&&wake){await wake.release();wake=null}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&active)keepAwake(true)});
const FOCUS_LINES=['Phone down. Slow breath in through the nose.','Picture the next set: tight, clean, controlled.','Shake out, sip water, stay at your station.','Drop your shoulders and exhale slowly.','The next set starts when the timer says so.','Think about one cue for the next set.'];
function tick(){
  if(!active) return;
  const $=id=>document.getElementById(id), now=Date.now();
  if($('elapsed')) $('elapsed').textContent=mmss((now-active.started)/1000);
  if(active.phase==='rest'&&active.rest){
    const r=active.rest, left=r.plan-(now-r.start)/1000;
    if(left<=10&&left>0&&!r.warned&&r.plan>20){r.warned=true;beep(660,120)}
    if(left<=0&&!r.beeped){r.beeped=true;beep(988,220,3);saveActive()}
    if($('restClock')){$('restClock').textContent=left>=0?mmss(left):'+'+mmss(-left);
      $('restBar').style.width=Math.max(0,Math.min(100,(1-left/r.plan)*100))+'%';
      const card=$('restCard'); if(card) card.classList.toggle('over',left<0);
      $('restHead').textContent=left>=0?(r.move?'Move to the next exercise':'Rest'):'Time to lift'}
  }
  if(active.work&&$('workClock')){const c=curItem(), el=(now-active.work)/1000, tgt=c&&c.it.d.secs||0;
    $('workClock').textContent=el<tgt?mmss(tgt-el):'+'+mmss(el-tgt);
    if(el>=tgt&&!active.workBeeped){active.workBeeped=true;beep(988,220,2)}}
}
setInterval(tick,250);

function viewProgress(){
  const S=state.sessions, now=Date.now(), wk=S.filter(s=>now-new Date(s.ts).getTime()<7*DAY);
  const mins=wk.reduce((t,s)=>t+(s.end?(new Date(s.end)-new Date(s.ts))/60000:0),0);
  const recent=S.slice(-8), rn=recent.reduce((t,s)=>t+(s.rest?s.rest.n:0),0), rok=recent.reduce((t,s)=>t+(s.rest?s.rest.ok:0),0);
  const avgOver=rn?Math.round(recent.reduce((t,s)=>t+(s.rest?s.rest.over:0),0)/rn):0;
  const stats=[[wk.length,'Workouts this week'],[Math.round(mins)+' min','Time this week'],[wk.reduce((t,s)=>t+s.entries.reduce((u,e)=>u+e.sets.length,0),0),'Sets this week'],[rn?Math.round(rok/rn*100)+'%':'–','Rests on time']];
  const ps=patternScores();
  const pbars=SCORED.map(p=>{const o=ps[p], lv=o.ex?levelOf(o.score):-1, pct=Math.min(100,o.score/1.2*100);
    return `<div class="barrow"><span class="lbl">${esc(PAT[p])}</span><div class="meter"><i class="l${Math.max(0,lv)}" style="width:${o.ex?Math.max(3,pct):0}%"></i></div>
      <span class="val muted">${o.ex?`<b style="color:var(--ink)">${LEVELS[lv].n}</b> · ${esc(o.ex.n)}`:'Not tested yet'}</span></div>`}).join('');
  // sets per muscle this week; primary muscle counts 1, others half
  const ms={}; wk.forEach(s=>s.entries.forEach(e=>{const x=BYID[e.ex]; if(!x||x.p==='mob') return; x.m.forEach((m,i)=>ms[m]=(ms[m]||0)+e.sets.length*(i?.5:1))}));
  const pri=state.profile.muscles, maxM=Math.max(16,...Object.values(ms));
  const mbars=Object.keys(MUS).map(m=>{const v=ms[m]||0, goal=pri.includes(m)?12:8;
    return `<div class="barrow"><span class="lbl">${esc(MUS[m])}${pri.includes(m)?' <span style="color:var(--accent)">★</span>':''}</span><div class="meter mbar"><i style="width:${v/maxM*100}%"></i><span class="goal" style="left:${goal/maxM*100}%"></span></div>
      <span class="val muted mono">${Math.round(v*10)/10} / ${goal} sets</span></div>`}).join('');
  const done=[...new Set(S.flatMap(s=>s.entries.map(e=>e.ex)))].filter(id=>BYID[id]);
  if(!chartEx||!done.includes(chartEx)) chartEx=done.find(id=>BYID[id].std)||done[0]||null;
  const hist=[...S].reverse().slice(0,30).map(s=>{
    const mins=s.end?Math.round((new Date(s.end)-new Date(s.ts))/60000):null;
    return `<div class="entry"><div><b>${esc(FOCUS_NAME[s.focus]||'Workout')}</b> <span class="meta">${fmtDate(s.ts)}${mins!=null?' · '+mins+' min':''}${s.rest&&s.rest.n?` · rests on time ${s.rest.ok}/${s.rest.n}`:''}</span>
      <div class="small muted">${s.entries.map(e=>{const x=BYID[e.ex];return x?`${esc(x.n)} ${e.sets.map(st=>esc(setTxt(x,st))).join(', ')}`:''}).filter(Boolean).join(' · ')}</div></div>
      <div>${pendingDelete===s.id?`<button class="btn sm danger" data-del="${s.id}">Delete</button> <button class="btn sm ghost" data-delcancel="1">Keep</button>`:`<button class="btn sm ghost" data-delask="${s.id}" aria-label="Delete workout">✕</button>`}</div></div>`}).join('');
  return `<div class="stack">
    <h2>Progress</h2>
    <section class="panel"><div class="stats">${stats.map(([b,s])=>`<div class="stat"><b>${b}</b><span>${s}</span></div>`).join('')}</div>
      ${rn?`<p class="small muted" style="margin-top:10px">Over your last ${recent.length} workouts you went over the rest timer by ${avgOver}s per rest on average. On time means within 15 seconds.</p>`:''}</section>
    <section class="panel stack"><div><h3>Movement strength</h3><p class="small muted">Your best set in each movement over the last 4 months, compared with bodyweight. Strong means roughly a 1.5× bodyweight squat, 2× deadlift, 1.25× bench, or 10+ strict pull-ups.</p></div>
      <div class="bars">${pbars}</div></section>
    <section class="panel stack"><div><h3>Sets per muscle this week</h3><p class="small muted">The line is a weekly target: 12 sets for muscles you starred under Gear &amp; goals, 8 for the rest.</p></div><div class="bars">${mbars}</div></section>
    <section class="panel stack"><div class="row" style="justify-content:space-between"><h3>Exercise trend</h3>
      ${done.length?`<select data-chart="1">${opt(done.map(id=>[id,BYID[id].n]),chartEx)}</select>`:''}</div>
      ${chartEx?chartHtml(chartEx):'<p class="empty">Log a workout to see trends.</p>'}</section>
    <section class="panel"><h3>History</h3>${hist||'<p class="empty">No workouts yet.</p>'}</section>
  </div>`;
}
function chartHtml(id){
  const x=BYID[id], h=exHistory(id); if(!h.length) return '';
  const m=metric(x,h[0].best), conv=v=>m.u==='kg'?toDisp(v):Math.round(v), unit=m.u==='kg'?U():m.u;
  const pts=h.map(o=>({t:new Date(o.ts).getTime(),v:conv(o.v),best:o.best}));
  const W=Math.max(300,Math.min(900,(document.getElementById('main').clientWidth||640)-66)),H=Math.round(Math.min(260,Math.max(180,W*.4))),L=44,R=12,T=14,B=28;
  chartW=W;
  const t0=pts[0].t,t1=pts[pts.length-1].t||t0+1, vs=pts.map(p=>p.v), lo0=Math.min(...vs), hi0=Math.max(...vs);
  const pad=(hi0-lo0)*.15||Math.max(1,hi0*.1), lo=Math.max(0,Math.floor(lo0-pad)), hi=Math.ceil(hi0+pad);
  const X=t=>pts.length===1?L+(W-L-R)/2:L+(t-t0)/(t1-t0||1)*(W-L-R), Y=v=>T+(1-(v-lo)/(hi-lo||1))*(H-T-B);
  const ticks=[0,.5,1].map(f=>Math.round(lo+(hi-lo)*f));
  const best=h.reduce((a,b)=>b.v>a.v?b:a);
  chartPts=pts.map(p=>({x:X(p.t),y:Y(p.v),lbl:`${fmtDate(p.t)} · ${p.v} ${unit}`,sub:setTxt(x,p.best)}));
  return `<p class="small muted">${esc(m.lbl)} per workout. Best: <b>${conv(best.v)} ${unit}</b> (${esc(setTxt(x,best.best))}, ${fmtDate(best.ts)}).</p>
  <div class="chart" id="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(x.n)} ${esc(m.lbl)} over time">
    ${ticks.map(v=>`<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="axis" x="${L-6}" y="${Y(v)+4}" text-anchor="end">${v}</text>`).join('')}
    <text class="axis" x="${L}" y="${H-6}">${fmtDate(t0)}</text>${pts.length>1?`<text class="axis" x="${W-R}" y="${H-6}" text-anchor="end">${fmtDate(t1)}</text>`:''}
    ${pts.length>1?`<polyline class="line" points="${pts.map(p=>X(p.t)+','+Y(p.v)).join(' ')}"/>`:''}
    ${pts.map(p=>`<circle class="dot" cx="${X(p.t)}" cy="${Y(p.v)}" r="5"/>`).join('')}
    <line class="cross" id="cross" y1="${T}" y2="${H-B}" x1="0" x2="0" visibility="hidden"/>
    <rect x="${L}" y="0" width="${W-L-R}" height="${H}" fill="transparent" id="chartHit"/>
  </svg><div class="tip" id="tip" hidden></div></div>`;
}
let chartPts=[], chartW=600;
function wireChart(){
  const hit=document.getElementById('chartHit'); if(!hit) return;
  const svg=hit.ownerSVGElement, tip=document.getElementById('tip'), cross=document.getElementById('cross'), box=document.getElementById('chart');
  const move=e=>{const r=svg.getBoundingClientRect(), k=chartW/r.width, mx=(e.clientX-r.left)*k;
    let best=chartPts[0]; chartPts.forEach(p=>{if(Math.abs(p.x-mx)<Math.abs(best.x-mx))best=p});
    cross.setAttribute('x1',best.x);cross.setAttribute('x2',best.x);cross.setAttribute('visibility','visible');
    tip.hidden=false; tip.innerHTML=`<b>${esc(best.lbl)}</b><br>${esc(best.sub)}`;
    tip.style.left=Math.min(Math.max(best.x/k,70),r.width-70)+'px'; tip.style.top=(best.y/k)+'px'};
  hit.addEventListener('pointermove',move); hit.addEventListener('pointerdown',move);
  hit.addEventListener('pointerleave',()=>{tip.hidden=true;cross.setAttribute('visibility','hidden')});
}

  'bicep curl':'curl','dumbbell bicep curl':'curl','dumbbell curl':'curl','barbell curl':'curl','cable bicep curl':'curl','ez bar curl':'curl',
  'hammer curl':'hammer','dumbbell hammer curl':'hammer','tricep pushdown':'pushdown','cable tricep pushdown':'pushdown','triceps pushdown':'pushdown','cable rope tricep pushdown':'pushdown',
  'overhead tricep extension':'ohext','dumbbell overhead tricep extension':'ohext','cable overhead tricep extension':'ohext',
  'calf raise':'calf','standing calf raise':'calf','dumbbell calf raise':'calf','tibialis raise':'tib',
  'farmers walk':'farmer','farmer walk':'farmer','farmers carry':'farmer','suitcase carry':'suitcase',
  'plank':'plank','side plank':'sideplank','copenhagen plank':'copen','dead bug':'deadbug','pallof press':'pallof',
  'hanging leg raise':'hlr','hanging knee raise':'hlr','ab wheel rollout':'abwheel','ab wheel':'abwheel','ab rollout':'abwheel',
  'cable wood chop':'chop','cable woodchop':'chop','wood chop':'chop',
  'box jump':'boxjump','broad jump':'broad','jump squat':'jumpsq','kettlebell swing':'swing','medicine ball slam':'slam','med ball slam':'slam',
  'rowing':'rowint','rowing machine':'rowint','row machine':'rowint','stationary bike':'bikeint','cycling':'bikeint','assault bike':'bikeint',
  'sled push':'sled','jump rope':'rope','burpee':'burpee'
};
const normName=s=>String(s||'').toLowerCase().replace(/[’'`]/g,'').replace(/\(.*?\)/g,' ').replace(/[^a-z0-9]+/g,' ').trim().split(' ').map(w=>w.length>3&&w.endsWith('s')&&!w.endsWith('ss')?w.slice(0,-1):w).join(' ');
const NORM_LOOKUP=(()=>{const m={}; Object.entries(FITBOD_NAMES).forEach(([k,v])=>m[normName(k)]=v); return m})();
function matchExercise(name){
  const n=normName(name); if(NORM_LOOKUP[n]) return NORM_LOOKUP[n];
  const lib=EX.find(x=>normName(x.n)===n); if(lib) return lib.id;
  const custom=EX.find(x=>x.custom&&normName(x.n)===n); return custom?custom.id:null;
}
function guessPattern(name){
  const n=normName(name), r=[[/stretch|foam|mobility|yoga/,'mob'],[/run|treadmill|elliptical|stair|bike|cycl|rowing|rower|ski erg|swim|walk(?!ing lunge)/,'cond'],
    [/jump|throw|slam|swing|clean|snatch/,'power'],[/carry|farmer/,'carry'],[/calf|tibialis/,'calves'],[/leg curl|hamstring curl/,'hinge'],[/leg extension/,'squat'],
    [/lunge|split squat|step up|single leg|pistol/,'single'],[/squat|leg press|hack/,'squat'],[/deadlift|good morning|hip thrust|glute bridge|back extension|hyperextension|pull through/,'hinge'],
    [/curl/,'arms.bi'],[/tricep|skull|kickback/,'arms.tri'],[/pull ?up|chin ?up|pulldown|pullover/,'vpull'],[/row/,'hpull'],[/face pull|reverse fly|rear delt|pull apart|external rotation/,'shoulder'],
    [/shoulder press|overhead|military|arnold|lateral raise|front raise|upright|shrug|handstand/,'vpush'],[/bench|chest|push ?up|fly|dip|press/,'hpush'],
    [/plank|crunch|sit ?up|ab |abs|oblique|leg raise|knee raise|russian twist|hollow|v up|mountain climber|woodchop/,'core']];
  for(const [re,p] of r) if(re.test(n+' ')) return p;
  return 'core';
}
const PAT_MUS={squat:['quads','glutes'],hinge:['hams','glutes'],single:['quads','glutes'],hpush:['chest','arms'],vpush:['shoulders','arms'],hpull:['back','arms'],vpull:['back','arms'],
  carry:['back','abs'],core:['abs'],power:['glutes','quads'],arms:['arms'],calves:['calves'],shoulder:['shoulders','back'],cond:['quads'],mob:['glutes']};
function parseCsv(text){
  text=text.replace(/^﻿/,'');
  const first=text.split(/\r?\n/)[0]||'', delim=(first.match(/;/g)||[]).length>(first.match(/,/g)||[]).length?';':',';
  const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++} else q=false } else cell+=c; continue }
    if(c==='"') q=true; else if(c===delim){row.push(cell);cell=''} else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(cell); rows.push(row); row=[]; cell='' } else cell+=c;
  }
  if(cell!==''||row.length){row.push(cell);rows.push(row)}
  return rows.filter(r=>r.some(c=>c.trim()!==''));
}
function parseDate(s){
  s=String(s||'').trim(); if(!s) return null;
  let d=new Date(s); if(!isNaN(d)) return d;
  const m=s.match(/^(\d{4})-(\d{2})-(\d{2})[ T](\d{1,2}):(\d{2})(?::(\d{2}))?\s*([+-]\d{2}):?(\d{2})?$/);
  if(m){d=new Date(`${m[1]}-${m[2]}-${m[3]}T${m[4].padStart(2,'0')}:${m[5]}:${m[6]||'00'}${m[7]}:${m[8]||'00'}`); if(!isNaN(d)) return d}
  const u=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})(?:\s+(\d{1,2}):(\d{2}))?/);
  if(u){const y=+u[3]<100?2000+(+u[3]):+u[3]; d=new Date(y,+u[1]-1,+u[2],+(u[4]||12),+(u[5]||0)); if(!isNaN(d)) return d}
  return null;
}
function readFitbod(text){
  const rows=parseCsv(text); if(rows.length<2) throw new Error('empty');
  const head=rows[0].map(h=>h.trim().toLowerCase()), col=re=>head.findIndex(h=>re.test(h));
  const ci={date:col(/date|time/),ex:col(/exercise|name/),reps:col(/^reps?\b|repetition/),w:col(/weight/),dur:col(/duration|time\s*\(s/),warm:col(/warm/),note:col(/note/)};
  if(ci.date<0||ci.ex<0) throw new Error('columns');
  const lbs=ci.w>=0&&/lb/.test(head[ci.w]);
  const num=v=>{const n=parseFloat(String(v==null?'':v).replace(',','.'));return isNaN(n)?0:n};
  const sets=[];
  rows.slice(1).forEach(r=>{
    const d=parseDate(r[ci.date]), name=(r[ci.ex]||'').trim(); if(!d||!name) return;
    if(ci.warm>=0&&/^(true|1|yes)$/i.test((r[ci.warm]||'').trim())) return;
    const reps=ci.reps>=0?num(r[ci.reps]):0, w=ci.w>=0?num(r[ci.w])*(lbs?1/LB:1):0, t=ci.dur>=0?num(r[ci.dur]):0;
    if(!reps&&!t) return;
    sets.push({d,name,reps:Math.round(reps),w:Math.round(w*100)/100,t:Math.round(t)});
  });
  if(!sets.length) throw new Error('rows');
  sets.sort((a,b)=>a.d-b.d);
  // a new workout starts after a gap of 3 hours, or on a new day when the export has no times
  const groups=[]; let cur=null;
  sets.forEach(s=>{ if(!cur||s.d-cur.last>3*3600000){cur={sets:[],first:s.d,last:s.d};groups.push(cur)} cur.sets.push(s); cur.last=s.d });
  const names={}; sets.forEach(s=>{names[s.name]=names[s.name]||{n:0,id:matchExercise(s.name),reps:0,w:0,t:0}; const o=names[s.name]; o.n++; if(s.reps)o.reps++; if(s.w)o.w++; if(s.t&&!s.reps)o.t++});
  return {groups,names,setCount:sets.length};
}
function fitbodPreview(){
  const F=fitbodImport; if(!F) return '';
  const names=Object.entries(F.names).sort((a,b)=>b[1].n-a[1].n), unmatched=names.filter(([,o])=>!o.id);
  const have=new Set(state.sessions.map(s=>s.id)), fresh=F.groups.filter(g=>!have.has(fbId(g))).length;
  const exOpts=[['new','Add as my own exercise'],...EX.slice().sort((a,b)=>a.n.localeCompare(b.n)).map(x=>[x.id,x.n])];
  return `<div class="stack" style="gap:10px">
    <p class="small"><b>${F.groups.length} workouts</b> and ${F.setCount} sets from ${fmtDate(F.groups[0].first)} to ${fmtDate(F.groups[F.groups.length-1].first)}.
      ${names.length-unmatched.length} of ${names.length} exercises matched this app’s library.${fresh<F.groups.length?` ${F.groups.length-fresh} workouts were imported before and will be skipped.`:''}</p>
    ${unmatched.length?`<p class="small muted">Choose what each of these should become. Anything left on “Add as my own exercise” is added to your exercise list.</p>
      <div class="stack" style="gap:6px">${unmatched.map(([n,o])=>`<label class="row small" style="justify-content:space-between"><span><b>${esc(n)}</b> <span class="muted">${o.n} sets</span></span>
        <select data-fbmap="${esc(n)}" style="max-width:220px">${opt(exOpts,o.map||'new')}</select></label>`).join('')}</div>`:''}
    <div class="row"><button class="btn sm primary" data-act="fbImport"${fresh?'':' disabled'}>Import ${fresh} workouts</button><button class="btn sm ghost" data-act="fbCancel">Cancel</button></div></div>`;
}
const fbId=g=>'fb'+Math.floor(hash(g.first.toISOString())*1e9).toString(36);
function applyFitbod(){
  const F=fitbodImport, p=state.profile; p.customEx=p.customEx||[];
  Object.entries(F.names).forEach(([n,o])=>{
    if(o.id) return;
    if(o.map&&o.map!=='new'){o.id=o.map;return}
    const pat=guessPattern(n), [pp,sub]=pat.split('.');
    const c={id:'cx'+uid6(),n,p:pp,t:o.reps?(o.w?'wr':'bw'):'time',m:PAT_MUS[pp]||['abs'],eq:[],c:[]};
    if(sub) c.sub=sub;
    p.customEx.push(c); o.id=c.id;
  });
  rebuildLibrary();
  const have=new Set(state.sessions.map(s=>s.id)); let added=0;
  F.groups.forEach(g=>{
    const id=fbId(g); if(have.has(id)) return;
    const by=new Map();
    g.sets.forEach(s=>{const ex=F.names[s.name].id; if(!by.has(ex)) by.set(ex,[]); by.get(ex).push(BYID[ex]&&BYID[ex].t==='time'?{w:s.w||null,r:null,t:s.t||null}:{w:s.w||null,r:s.reps||null,t:s.t||null})});
    const entries=[...by.entries()].map(([ex,sets])=>({ex,sets}));
    const pats=new Set(entries.map(e=>BYID[e.ex]&&BYID[e.ex].p)), up=['hpush','vpush','hpull','vpull','arms'].some(k=>pats.has(k)), low=['squat','hinge','single'].some(k=>pats.has(k));
    const end=new Date(Math.max(g.last.getTime(),g.first.getTime()+g.sets.length*2.5*60000));
    state.sessions.push({id,ts:g.first.toISOString(),end:end.toISOString(),focus:up&&low?'full':up?'upper':low?'lower':'full',entries,src:'fitbod'});
    added++;
  });
  state.sessions.sort((a,b)=>a.ts<b.ts?-1:1);
  p.examples=false; saveProfile(); planCache=null; fitbodImport=null;
  return added;
}

/* ---------------- Events ---------------- */
function toast(t){const h=document.getElementById('toastHost');h.innerHTML=`<div class="toast" role="status">${esc(t)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>h.innerHTML='',2600)}
const toggle=(arr,v)=>{const i=arr.indexOf(v);i>=0?arr.splice(i,1):arr.push(v)};
document.addEventListener('click',async e=>{
  const t=e.target.closest('button,[data-open],[data-close]'); if(!t) return;
  const d=t.dataset, p=state.profile;
  if(d.tab){tab=d.tab;selected=null;pendingDelete=null;try{sessionStorage.setItem('fc.tab',tab)}catch(_){};render();window.scrollTo(0,0);return}
  if(d.close){selected=null;render();return}
  if(d.open){selected=d.open;render();return}
  if(d.goex){const [b,i]=d.goex.split(':').map(Number); goExercise(b,i); return}
  if(d.swap){const [bi,ii]=d.swap.split(':').map(Number); if(swapIn(planCache,bi,ii)){persist();render()} return}
  if(d.fav){toggle(p.favorites,d.fav);touchProfile();render();return}
  if(d.eq){toggle(p.equipment,d.eq);touchProfile();render();return}
  if(d.rmeq){p.customEq=p.customEq.filter(x=>x.id!==d.rmeq);touchProfile();render();return}
  if(d.sport){toggle(p.sports,d.sport);if(!p.sports.includes(p.ctx.sport))p.ctx.sport='all';touchProfile();render();return}
  if(d.mus){toggle(p.muscles,d.mus);touchProfile();render();return}
  if(d.units){p.units=d.units;saveProfile();render();return}
  if(d.exshow){exShow=d.exshow;render();return}
  if(d.step&&active&&active.draft){const k=d.step, cur=k==='w'?toDisp(active.draft.w)||0:+(active.draft[k]||0), v=Math.max(0,Math.round((cur+(+d.v))*2)/2);
    active.draft[k]=k==='w'?fromDisp(v):v; saveActive(); const el=document.getElementById('dr-'+k); if(el) el.value=k==='w'?toDisp(active.draft.w):v; return}
  if(d.delask){pendingDelete=d.delask;render();return}
  if(d.delcancel){pendingDelete=null;render();return}
  if(d.del){state.sessions=state.sessions.filter(s=>s.id!==d.del);state.deleted.push(d.del);pendingDelete=null;persist();toast('Workout deleted');render();return}
  if(d.rmex){p.customEx=p.customEx.filter(c=>c.id!==d.rmex);p.favorites=p.favorites.filter(f=>f!==d.rmex);selected=null;touchProfile();rebuildLibrary();render();return}
  switch(d.act){
    case 'fbCancel': fitbodImport=null; render(); return;
    case 'fbImport': {const n=applyFitbod(); toast(`Imported ${n} workouts from Fitbod`); render(); return}
    case 'start': startWorkout(); return;
    case 'exPrev': stepExercise(-1); return;
    case 'exNext': stepExercise(1); return;
    case 'exList': selected='runlist'; render(); return;
    case 'signin': boot(true); return;
    case 'demo': mode='demo'; render(); return;
    case 'driveSave': store.flush(); return;
    case 'signOut': store.signOut(); useData({}); active=null; pendingDelete=null; mode='signin'; keepAwake(false); render(); return;
    case 'shuffle': reshuffle(); return;
    case 'dismissSum': lastSummary=null; render(); return;
    case 'done': audio(); doneSet(); return;
    case 'startSet': startSet(); return;
    case 'restAdj': if(active&&active.rest){active.rest.plan=Math.max(5,active.rest.plan+(+d.v)); if(active.rest.plan-(Date.now()-active.rest.start)/1000>0){active.rest.beeped=false} saveActive(); tick()} return;

    case 'swapRun': {const c=curItem(); if(c&&swapIn(active.plan,c.st.b,c.st.i)){initDraft();saveActive();render()} return}
    case 'workStart': audio(); active.work=Date.now(); active.workBeeped=false; render(); return;

    case 'addEq': {const el=document.getElementById('newEq'), n=(el.value||'').trim(); if(!n) return; p.customEq=p.customEq||[]; p.customEq.push({id:'eq'+uid6(),n}); touchProfile(); render(); return}
    case 'saveEx': {
      const n=(document.getElementById('nx-n').value||'').trim(); if(!n){toast('Give it a name');return}
      const m=[...document.querySelectorAll('[data-nxm]:checked')].map(i=>i.dataset.nxm), eq=[...document.querySelectorAll('[data-nxe]:checked')].map(i=>i.dataset.nxe);
      const c={id:'cx'+uid6(),n,p:document.getElementById('nx-p').value,t:document.getElementById('nx-t').value,m,eq,c:document.getElementById('nx-c').value.split('\n').map(s=>s.trim()).filter(Boolean)};
      p.customEx=p.customEx||[]; p.customEx.push(c); p.favorites.push(c.id); touchProfile(); rebuildLibrary(); selected=c.id; toast('Added to your exercises and favorites'); render(); return}
    case 'sound': p.sound=!p.sound; saveProfile(); render(); if(p.sound) beep(); return;
    case 'resetAsk': pendingDelete='ALL'; render(); return;
    case 'resetYes': state={profile:defaultProfile(),sessions:[],deleted:state.deleted.concat(state.sessions.map(s=>s.id))}; active=null; pendingDelete=null; planCache=null; saveProfile(); rebuildLibrary(); toast('Everything erased'); render(); return;
    case 'export': {
      const data=JSON.stringify({app:'fitness-coach',exported:new Date().toISOString(),...state},null,2);
      try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download='fitness-coach-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();toast('Backup downloaded')}
      catch(_){try{await navigator.clipboard.writeText(data);toast('Backup copied to clipboard')}catch(__){toast('Export isn’t available here')}}
      return}
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&selected){selected=null;render()}});
document.addEventListener('input',e=>{
  const t=e.target, d=t.dataset;
  if(d.draft&&active&&active.draft){const v=t.value===''?null:+t.value; active.draft[d.draft]=d.draft==='w'?fromDisp(v):v; saveActive(); return}
  if(d.balance){const a=+t.value; document.getElementById('mixTxt').textContent=a<=35?'Plans lean toward muscle and shape.':a>=65?'Plans lean toward performance and sport.':'A mix of strength, power and physique work.'}

document.addEventListener('change',async e=>{
  const t=e.target, d=t.dataset, p=state.profile;
  if(d.ctx){p.ctx[d.ctx]=d.ctx==='minutes'?+t.value:t.value;saveProfile();render();return}
