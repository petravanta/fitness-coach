<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fitness Coach</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* ===== Shared look: Skating Mentor · Fitness Coach =====
   Same tokens, type and components across Peter's apps. Each app only changes the four --accent values below. */
:root{
  --bg:#eef2f4; --surface:#ffffff; --sunk:#e3e9ec; --line:#cdd6db; --ink:#14212a; --muted:#566771; --faint:#8a99a2;
  --lv-new:#9aa8b0; --lv-learn:#c07a00; --lv-dev:#2f6fd0; --lv-conf:#11897a; --lv-solid:#0c5e3e;
  --lv-learn-bg:#fbefd9; --lv-dev-bg:#e1ebfa; --lv-conf-bg:#d9f1ec; --lv-solid-bg:#d5eadf;
  --danger:#b3261e; --danger-soft:#fbe3e1;
  --f-display:"Unbounded","Arial Rounded MT Bold",system-ui,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f161b; --surface:#172129; --sunk:#111a20; --line:#2a3842; --ink:#e4ecf0; --muted:#9fb0ba; --faint:#6b7d88;
  --lv-new:#64757f; --lv-learn:#e6a33a; --lv-dev:#6ea0f0; --lv-conf:#3cc3ad; --lv-solid:#6fd39a;
  --lv-learn-bg:#3a2a10; --lv-dev-bg:#182a45; --lv-conf-bg:#0f3530; --lv-solid-bg:#143224;
  --danger:#ff8a80; --danger-soft:#3d1c1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161b; --surface:#172129; --sunk:#111a20; --line:#2a3842; --ink:#e4ecf0; --muted:#9fb0ba; --faint:#6b7d88;
  --lv-new:#64757f; --lv-learn:#e6a33a; --lv-dev:#6ea0f0; --lv-conf:#3cc3ad; --lv-solid:#6fd39a;
  --lv-learn-bg:#3a2a10; --lv-dev-bg:#182a45; --lv-conf-bg:#0f3530; --lv-solid-bg:#143224;
  --danger:#ff8a80; --danger-soft:#3d1c1a; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar{display:flex;align-items:center;gap:16px;padding-block:12px 0;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.brand svg{width:26px;height:26px;flex:none}
.save-state{margin-left:auto;font-size:12px;color:var(--muted);font-family:var(--f-mono)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-top:8px;scrollbar-width:none}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px 9px;font-weight:600;color:var(--muted);white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
main{padding-block:20px 80px}
h2{font-family:var(--f-display);font-weight:500;font-size:20px;letter-spacing:-.01em;margin:0;text-wrap:balance}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none}
.btn.danger{color:var(--danger)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.big{padding:12px 22px;font-size:16px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
label.field{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
select,input[type=text],input[type=number],textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:15px;text-transform:none;letter-spacing:0;font-weight:500;min-width:0}
textarea{resize:vertical}
.ctx{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:end}
@media (max-width:720px){.ctx{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ctx-note{font-size:13px;color:var(--muted);margin-top:10px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.pill.l1{background:var(--lv-learn-bg);color:var(--lv-learn)}
.pill.l2{background:var(--lv-dev-bg);color:var(--lv-dev)}
.pill.l3{background:var(--lv-conf-bg);color:var(--lv-conf)}
.pill.l4{background:var(--lv-solid-bg);color:var(--lv-solid)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:720px){.two{grid-template-columns:minmax(0,1fr)}}
.banner{background:var(--accent-soft);border-radius:var(--r);padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner p{flex:1 1 260px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:620px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat b{display:block;font-family:var(--f-mono);font-size:24px;font-weight:500}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.meter{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.scrim{position:fixed;inset:0;background:rgba(10,16,20,.35);z-index:40}
.drawer{position:fixed;z-index:41;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);border-left:1px solid var(--line);overflow-y:auto;
  padding:calc(env(safe-area-inset-top,0px) + 18px) max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) 18px;display:flex;flex-direction:column;gap:16px}
@media (max-width:640px){.drawer{top:auto;left:0;width:100%;max-height:86vh;border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;padding-left:max(18px,env(safe-area-inset-left,0px))}}
.drawer .x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:max(12px,env(safe-area-inset-right,0px));background:var(--sunk);border:0;border-radius:999px;width:32px;height:32px;font-size:18px;line-height:1}
@media (max-width:640px){.drawer .x{top:12px}}
.drawer h2{padding-right:40px}
.drawer ul,.cues{margin:0;padding-left:18px}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:inline-flex;align-items:center;gap:5px;font-size:13px;border:1px solid var(--line);border-radius:6px;padding:3px 8px;background:var(--sunk)}
.entry{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:8px 0;border-top:1px solid var(--line)}
.entry .meta{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:60;max-width:calc(100% - 32px)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.4}}}
/* ===== end shared look ===== */

/* Fitness Coach accent */
:root{--accent:#4f46c8;--accent-ink:#ffffff;--accent-soft:#e6e4fb}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--accent:#9d95ff;--accent-ink:#120f33;--accent-soft:#25224d}}
:root[data-theme="dark"]{--accent:#9d95ff;--accent-ink:#120f33;--accent-soft:#25224d}

/* Layout: plan is a column of blocks (a block is one exercise or a superset); the workout runner replaces the plan with one big card at a time (set, then rest timer). */
.plan{display:flex;flex-direction:column;gap:12px}
.block{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;grid-template-columns:52px minmax(0,1fr);gap:4px 14px}
.block .slot{grid-row:1/span 2;text-align:center;padding-top:2px}
.block .slot b{display:block;font-family:var(--f-mono);font-size:18px;font-weight:500}
.block .slot span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.role{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.role.warm{color:var(--lv-dev)} .role.power{color:var(--lv-learn)} .role.sport{color:var(--lv-conf)} .role.cond{color:var(--muted)}
.exl{display:flex;flex-direction:column;gap:10px}
.ex{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 10px;align-items:start}
.ex .tag{font-family:var(--f-mono);font-size:12px;color:var(--faint);padding-top:3px;min-width:20px}
.ex .name{font-weight:700;font-size:16px;background:none;border:0;padding:0;text-align:left;color:var(--ink)}
.ex .name:hover{text-decoration:underline;text-decoration-color:var(--accent)}
.ex .dose{grid-column:2;font-size:14px}
.ex .sug{grid-column:2/span 2;font-size:13px;color:var(--muted)}
@media (max-width:560px){.block{grid-template-columns:minmax(0,1fr)}.block .slot{grid-row:auto;text-align:left;display:flex;gap:6px;align-items:baseline}.block .slot b{display:inline;font-size:14px}}
/* runner */
.runbar{display:flex;gap:8px 16px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.runbar b{color:var(--ink)}
.runcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px}
.runcard .big-name{font-family:var(--f-display);font-weight:500;font-size:24px;letter-spacing:-.01em;background:none;border:0;padding:0;text-align:left;color:var(--ink);line-height:1.25}
.target{font-size:16px;font-weight:600}
.steppers{display:flex;gap:16px;flex-wrap:wrap}
.stepper{display:flex;flex-direction:column;gap:6px}
.stepper .ctl{display:flex;align-items:center;gap:6px}
.stepper button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--sunk);font-size:20px;font-weight:600}
.stepper input{width:92px;text-align:center;font-family:var(--f-mono);font-size:22px;padding:8px 6px}
.done-set{width:100%;padding:16px;font-size:18px;border-radius:14px}
.rest{text-align:center;align-items:center}
.clock{font-family:var(--f-mono);font-weight:500;font-size:clamp(64px,22vw,128px);line-height:1;font-variant-numeric:tabular-nums}
.rest .meter{width:100%;height:10px}
.rest.over{border-color:var(--danger);background:var(--danger-soft)}
.rest.over .clock{color:var(--danger)}
.rest.over .meter i{background:var(--danger)}
.focus-line{font-size:15px;color:var(--muted);font-style:italic}
.next{background:var(--sunk);border-radius:10px;padding:12px 14px;text-align:left;width:100%}
.setlog{display:flex;flex-wrap:wrap;gap:6px}
.setlog span{font-family:var(--f-mono);font-size:13px;background:var(--sunk);border-radius:6px;padding:2px 8px}
.upnext{font-size:13px;color:var(--muted)}
/* progress */
.bars{display:flex;flex-direction:column;gap:10px}
.barrow{display:grid;grid-template-columns:150px minmax(0,1fr) 190px;gap:12px;align-items:center;font-size:14px}
.barrow .lbl{font-weight:600}
.barrow .val{font-size:12px;text-align:right}
@media (max-width:560px){.barrow{grid-template-columns:110px minmax(0,1fr);}.barrow .val{grid-column:2;text-align:left;margin-top:-6px}}
.barrow .meter i.l0{background:var(--lv-new)} .barrow .meter i.l1{background:var(--lv-learn)} .barrow .meter i.l2{background:var(--lv-dev)} .barrow .meter i.l3{background:var(--lv-conf)} .barrow .meter i.l4{background:var(--lv-solid)}
.mbar{position:relative}
.mbar .goal{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.5}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--muted);font-family:var(--f-mono);font-size:11px}
.chart .line{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .cross{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:8px;padding:6px 10px;font-size:12px;white-space:nowrap;transform:translate(-50%,-110%)}
.exrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.exrow:last-child{border-bottom:0}
.exrow .nm{background:none;border:0;padding:0;text-align:left;font-weight:600;color:var(--ink)}
.star{background:none;border:0;font-size:20px;line-height:1;color:var(--faint);padding:2px}
.star[aria-pressed="true"]{color:var(--accent)}
.needs{font-size:12px;color:var(--faint)}
input[type=range]{width:100%;accent-color:var(--accent)}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="9" width="6" height="14" rx="2" fill="var(--accent)"/><rect x="23" y="9" width="6" height="14" rx="2" fill="var(--accent)"/><rect x="9" y="14.5" width="14" height="3" rx="1.5" fill="var(--ink)"/><rect x="0.5" y="12.5" width="2.5" height="7" rx="1" fill="var(--ink)"/><rect x="29" y="12.5" width="2.5" height="7" rx="1" fill="var(--ink)"/></svg>
        Fitness Coach
      </div>
      <span class="save-state" id="saveState">Loading…</span>
      <button class="btn sm" id="driveResume" data-act="driveSync" hidden>Resume Drive sync</button>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="today" aria-selected="true">Today</button>
      <button role="tab" data-tab="progress" aria-selected="false">Progress</button>
      <button role="tab" data-tab="exercises" aria-selected="false">Exercises</button>
      <button role="tab" data-tab="gear" aria-selected="false">Gear &amp; goals</button>
      <button role="tab" data-tab="settings" aria-selected="false">Settings</button>
    </nav>
  </div>
</header>
<main class="wrap" id="main"></main>
<div id="drawerHost"></div>
<div id="toastHost"></div>

<script>
/* ---------------- Library ---------------- */
const PAT={squat:'Squat',hinge:'Hinge',single:'Single-leg',hpush:'Horizontal push',vpush:'Vertical push',hpull:'Horizontal pull',vpull:'Vertical pull',
  carry:'Carry & grip',core:'Core',power:'Power & jumps',arms:'Arms',calves:'Calves & shins',shoulder:'Shoulder health',cond:'Conditioning',mob:'Mobility'};
// Movement patterns that get a strength score on the Progress tab
const SCORED=['squat','hinge','single','hpush','vpush','hpull','vpull','carry','core'];
const MUS={chest:'Chest',shoulders:'Shoulders',back:'Back',arms:'Arms',abs:'Abs & obliques',glutes:'Glutes',quads:'Quads',hams:'Hamstrings',calves:'Calves'};
const QUAL={power:'explosive power',single:'single-leg strength',lat:'lateral movement',rot:'rotation',grip:'grip',endur:'endurance',mob:'mobility',core:'trunk stability',post:'posterior chain',shoulder:'shoulder resilience'};
const SPORTS={
  skate:{n:'Skating',q:{single:3,lat:3,post:2,core:2,power:1,mob:1}},
  run:{n:'Running',q:{single:3,post:2,power:2,endur:2,core:1}},
  cycle:{n:'Cycling',q:{single:2,post:2,core:2,mob:2,endur:1}},
  racket:{n:'Tennis & racket sports',q:{rot:3,lat:3,power:2,shoulder:2}},
  ski:{n:'Skiing & snowboarding',q:{single:3,lat:2,core:2,endur:2}},
  climb:{n:'Climbing',q:{grip:3,shoulder:2,core:2,mob:1}},
  swim:{n:'Swimming',q:{shoulder:3,core:2,mob:2,endur:1}},
  soccer:{n:'Soccer',q:{single:3,lat:2,power:2,post:2}},
  hoops:{n:'Basketball & volleyball',q:{power:3,single:2,lat:2}},
  hike:{n:'Hiking',q:{single:2,endur:3,grip:1}},
  fight:{n:'Martial arts',q:{rot:3,power:2,core:2,mob:2}},
  golf:{n:'Golf',q:{rot:3,mob:3,core:2}},
  surf:{n:'Surfing & paddling',q:{shoulder:3,core:2,mob:2,single:1}}
};
const EQUIP={barbell:'Barbell & plates',rack:'Squat rack',bench:'Bench',dumbbell:'Dumbbells',kettlebell:'Kettlebells',cable:'Cable machine',pullup:'Pull-up bar',
  dip:'Dip bars',band:'Resistance bands',trapbar:'Trap bar',landmine:'Landmine',medball:'Medicine ball',box:'Plyo box',legpress:'Leg press',rings:'Rings or TRX',
  abwheel:'Ab wheel',backext:'Back extension bench',rower:'Rowing machine',bike:'Bike or air bike',jumprope:'Jump rope',sled:'Sled'};
const TRACK={wr:'Weight × reps',bw:'Bodyweight reps',time:'Time'};

// E(id, name, pattern, muscles (first is primary), equipment options ("a+b|c", "-" = none), tracking, extras)
// std: estimated-max ÷ bodyweight that counts as "strong" (score 100); bwf: share of bodyweight moved; per: weight is per hand;
// reps/base: reps or seconds that count as strong for bodyweight-only or timed holds
function E(id,n,p,m,eq,t,o={}){return{id,n,p,m:m.split(' '),eq:eq.split('|').map(s=>s==='-'?[]:s.split('+')),t,q:(o.q||'').split(' ').filter(Boolean),c:o.c||[],
  std:o.std||null,bwf:o.bwf||0,per:!!o.per,main:!!o.main,reps:o.reps||null,base:o.base||null,sub:o.sub||null}}
const LIB=[
E('bsquat','Back squat','squat','quads glutes','barbell+rack','wr',{std:1.5,main:1,q:'post',c:['Brace hard before you descend','Knees track over your toes','Drive the floor away']}),
E('fsquat','Front squat','squat','quads abs','barbell+rack','wr',{std:1.2,main:1,q:'core',c:['Elbows high, chest proud','Sit straight down between your heels','Stay tall out of the bottom']}),
E('goblet','Goblet squat','squat','quads glutes','dumbbell|kettlebell','wr',{std:.6,q:'mob',c:['Hold the weight at your chest','Elbows inside the knees at the bottom','Pause low, then stand']}),
E('legpress','Leg press','squat','quads glutes','legpress','wr',{std:2.6,c:['Feet shoulder-width, mid-platform','Lower until your hips start to tuck','Don’t slam the knees straight']}),
E('dl','Deadlift','hinge','hams glutes back','barbell','wr',{std:2,main:1,q:'post grip',c:['Bar over mid-foot, shins to the bar','Pull the slack out before it leaves the floor','Hips and shoulders rise together']}),
E('tbdl','Trap bar deadlift','hinge','quads glutes hams','trapbar','wr',{std:2.1,main:1,q:'post power',c:['Stand centred in the handle','Chest up, lats tight','Drive hard through the whole foot']}),
E('rdl','Romanian deadlift','hinge','hams glutes','barbell|dumbbell|kettlebell','wr',{std:1.3,q:'post',c:['Soft knees, push the hips back','Weight slides down the thighs','Stop when the hamstrings stop you']}),
E('hipthrust','Hip thrust','hinge','glutes hams','barbell+bench|dumbbell+bench','wr',{std:1.8,q:'post',c:['Upper back on the bench edge','Chin tucked, ribs down','Squeeze and hold at the top']}),

const DRIVE_FILE='Fitness Coach data.json', DAPI='https://www.googleapis.com';
const Drive={token:null,exp:0,fileId:lsGet('fc.driveFile'),on:!!lsGet('fc.driveOn'),busy:false,last:null,timer:null,err:null,lastAsk:0};

function loadGis(){return new Promise((res,rej)=>{
  if(window.google&&google.accounts&&google.accounts.oauth2) return res();
  const sc=document.createElement('script'); sc.src='https://accounts.google.com/gsi/client'; sc.onload=res; sc.onerror=()=>rej(new Error('gis')); document.head.appendChild(sc)})}
function driveToken(){return new Promise(async(res,rej)=>{
  try{await loadGis()}catch(e){return rej(e)}
  const c=google.accounts.oauth2.initTokenClient({client_id:GOOGLE_CLIENT_ID,scope:'https://www.googleapis.com/auth/drive.file',
    callback:r=>{if(r.error) return rej(r); Drive.token=r.access_token; Drive.exp=Date.now()+(Number(r.expires_in||3600)-60)*1000; lsSet('fc.driveTok',{token:Drive.token,exp:Drive.exp}); res()},
    error_callback:rej});
  c.requestAccessToken({prompt:Drive.on?'':'consent'});
})}
async function dfetch(path,opt={}){
  if(!driveLive()) throw {code:'expired'};
  const r=await fetch(DAPI+path,{...opt,headers:{...(opt.headers||{}),Authorization:'Bearer '+Drive.token}});
  if(r.status===401){Drive.token=null; lsSet('fc.driveTok',null); throw {code:'expired'}}
  if(!r.ok) throw {code:'http',status:r.status};
  return r;
}
async function driveFind(){
  if(Drive.fileId){
    try{const j=await (await dfetch(`/drive/v3/files/${Drive.fileId}?fields=id,trashed`)).json(); if(!j.trashed) return Drive.fileId}
    catch(e){if(e.code==='expired') throw e}
  }
  const q=encodeURIComponent(`name='${DRIVE_FILE}' and trashed=false`);
  const j=await (await dfetch(`/drive/v3/files?q=${q}&orderBy=modifiedTime desc&fields=files(id)`)).json();
  Drive.fileId=j.files&&j.files[0]?j.files[0].id:null; lsSet('fc.driveFile',Drive.fileId);
  return Drive.fileId;
}
async function driveRead(){const id=await driveFind(); return id?(await dfetch(`/drive/v3/files/${id}?alt=media`)).json():null}
async function driveWrite(){
  const body=JSON.stringify({app:'fitness-coach',saved:new Date().toISOString(),profile:state.profile,sessions:state.sessions,deleted:state.deleted});
  const id=await driveFind();
  if(id){await dfetch(`/upload/drive/v3/files/${id}?uploadType=media`,{method:'PATCH',headers:{'Content-Type':'application/json'},body});return}
  const b='fc'+uid6(), meta=JSON.stringify({name:DRIVE_FILE,mimeType:'application/json'});
  const multi=`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${meta}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${b}--`;
  const j=await (await dfetch('/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body:multi})).json();
  Drive.fileId=j.id; lsSet('fc.driveFile',j.id);
}
// Combine Drive and this browser: every workout from both (minus deletions), and the more recently edited profile
function mergeRemote(r){
  if(!r||!r.profile) return false;
  const del=new Set([...(state.deleted||[]),...(r.deleted||[])]);
  const byId=new Map(); [...(r.sessions||[]),...state.sessions].forEach(s=>{if(s&&s.id&&!del.has(s.id))byId.set(s.id,s)});
  const before=JSON.stringify([state.profile.updatedAt,state.sessions.length]);
  if((r.profile.updatedAt||'')>(state.profile.updatedAt||'')) state.profile=fixProfile(r.profile);
  state.sessions=[...byId.values()].sort((a,b)=>a.ts<b.ts?-1:1); state.deleted=[...del];
  lsSet(LS_KEY,state); rebuildLibrary();
  return JSON.stringify([state.profile.updatedAt,state.sessions.length])!==before;
}
function driveStatus(){
  if(!driveConfigured()||!Drive.on) return null;
  if(Drive.busy) return 'Syncing with Google Drive…';
  if(Drive.err) return Drive.err;
  if(!driveLive()) return 'Google Drive paused';
  return 'Synced to Google Drive'+(Drive.last?' · '+Drive.last.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}):'');
}
function showDriveStatus(){const t=driveStatus(); setSaveState(t||'Saved in this browser'); const b=document.getElementById('driveResume'); if(b) b.hidden=!(driveConfigured()&&Drive.on&&!driveLive()&&!Drive.busy)}
async function driveSync(interactive){
  if(Drive.busy) return;
  try{
    if(!driveLive()){ if(!interactive){showDriveStatus();return} await driveToken() }
    Drive.busy=true; Drive.err=null; showDriveStatus();
    const changed=mergeRemote(await driveRead());
    await driveWrite();
    Drive.on=true; lsSet('fc.driveOn',true); Drive.last=new Date();
    if(changed){planCache=null; render()}
  }catch(e){
    if(e&&e.code!=='expired') Drive.err=(e.type==='popup_closed'||e.error==='access_denied')?null:'Couldn’t reach Google Drive';
    if(interactive&&Drive.err) toast('Couldn’t connect to Google Drive. Your data is still saved in this browser.');
  }finally{Drive.busy=false; showDriveStatus(); if(tab==='settings') render()}
}
function driveSoon(){
  if(!driveConfigured()||!Drive.on) return;
  clearTimeout(Drive.timer);
  Drive.timer=setTimeout(async()=>{
    if(!driveLive()){showDriveStatus();return}
    try{Drive.busy=true;showDriveStatus();await driveWrite();Drive.last=new Date();Drive.err=null}
    catch(e){if(e.code!=='expired')Drive.err='Couldn’t reach Google Drive'}
    finally{Drive.busy=false;showDriveStatus()}
  },3000);
}
function driveDisconnect(){
  if(Drive.token&&window.google&&google.accounts&&google.accounts.oauth2) google.accounts.oauth2.revoke(Drive.token,()=>{});
  Drive.token=null; Drive.on=false; Drive.err=null; lsSet('fc.driveOn',false); lsSet('fc.driveTok',null); showDriveStatus(); render();
}

/* ---------------- Strength model ---------------- */
// Estimated one-rep max (Epley) for a set, counting the share of bodyweight the movement lifts
function e1rm(x,s){const load=(s.w||0)+(x.bwf?bwKg()*x.bwf:0); return load*(1+Math.min(s.r||0,15)/30)}
// Strength score for one set: 1.0 means "strong" for that exercise
function setScore(x,s){
  if(x.t==='time'){ if(!x.base) return null; const hold=Math.min(1,(s.t||0)/x.base); return x.std?((s.w||0)/(bwKg()*x.std))*hold:(s.t||0)/x.base }
  if(x.std) return e1rm(x,s)/(bwKg()*x.std);
  if(x.reps) return (s.r||0)/x.reps;
  return null;
}
// One number per workout for charts: estimated max for loaded lifts, best reps for bodyweight work, longest time for holds
function metric(x,s){
  if(x.t==='time') return {v:s.t||0,u:'s',lbl:'Longest set'};
  if(x.t==='bw'&&!x.std) return {v:s.r||0,u:'reps',lbl:'Best set (reps)'};
  return {v:e1rm(x,s),u:'kg',lbl:'Estimated 1-rep max'};
}
const LEVELS=[{n:'Starting',min:0},{n:'Building',min:.4},{n:'Solid',min:.6},{n:'Strong',min:.8},{n:'Athletic',min:1}];
const levelOf=sc=>{let i=0;LEVELS.forEach((L,k)=>{if(sc>=L.min)i=k});return i};
function patternScores(){
  const since=Date.now()-120*DAY, out={};
  SCORED.forEach(p=>out[p]={score:0,ex:null,set:null});
  state.sessions.forEach(ses=>{ if(new Date(ses.ts).getTime()<since) return;
    ses.entries.forEach(e=>{const x=BYID[e.ex]; if(!x||!out[x.p]) return;
      e.sets.forEach(s=>{const sc=setScore(x,s); if(sc!=null&&sc>out[x.p].score) out[x.p]={score:sc,ex:x,set:s}})})});
  return out;
}
function exHistory(id){

function chartHtml(id){
  const x=BYID[id], h=exHistory(id); if(!h.length) return '';
  const m=metric(x,h[0].best), conv=v=>m.u==='kg'?toDisp(v):Math.round(v), unit=m.u==='kg'?U():m.u;
  const pts=h.map(o=>({t:new Date(o.ts).getTime(),v:conv(o.v),best:o.best}));
  const W=Math.max(300,Math.min(900,(document.getElementById('main').clientWidth||640)-66)),H=Math.round(Math.min(260,Math.max(180,W*.4))),L=44,R=12,T=14,B=28;
  chartW=W;
  const t0=pts[0].t,t1=pts[pts.length-1].t||t0+1, vs=pts.map(p=>p.v), lo0=Math.min(...vs), hi0=Math.max(...vs);
  const pad=(hi0-lo0)*.15||Math.max(1,hi0*.1), lo=Math.max(0,Math.floor(lo0-pad)), hi=Math.ceil(hi0+pad);
  const X=t=>pts.length===1?L+(W-L-R)/2:L+(t-t0)/(t1-t0||1)*(W-L-R), Y=v=>T+(1-(v-lo)/(hi-lo||1))*(H-T-B);
  const ticks=[0,.5,1].map(f=>Math.round(lo+(hi-lo)*f));
  const best=h.reduce((a,b)=>b.v>a.v?b:a);
  chartPts=pts.map(p=>({x:X(p.t),y:Y(p.v),lbl:`${fmtDate(p.t)} · ${p.v} ${unit}`,sub:setTxt(x,p.best)}));
  return `<p class="small muted">${esc(m.lbl)} per workout. Best: <b>${conv(best.v)} ${unit}</b> (${esc(setTxt(x,best.best))}, ${fmtDate(best.ts)}).</p>
  <div class="chart" id="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(x.n)} ${esc(m.lbl)} over time">
    ${ticks.map(v=>`<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="axis" x="${L-6}" y="${Y(v)+4}" text-anchor="end">${v}</text>`).join('')}
    <text class="axis" x="${L}" y="${H-6}">${fmtDate(t0)}</text>${pts.length>1?`<text class="axis" x="${W-R}" y="${H-6}" text-anchor="end">${fmtDate(t1)}</text>`:''}
    ${pts.length>1?`<polyline class="line" points="${pts.map(p=>X(p.t)+','+Y(p.v)).join(' ')}"/>`:''}
    ${pts.map(p=>`<circle class="dot" cx="${X(p.t)}" cy="${Y(p.v)}" r="5"/>`).join('')}
    <line class="cross" id="cross" y1="${T}" y2="${H-B}" x1="0" x2="0" visibility="hidden"/>
    <rect x="${L}" y="0" width="${W-L-R}" height="${H}" fill="transparent" id="chartHit"/>
  </svg><div class="tip" id="tip" hidden></div></div>`;
}
let chartPts=[], chartW=600;
function wireChart(){
  const hit=document.getElementById('chartHit'); if(!hit) return;
  const svg=hit.ownerSVGElement, tip=document.getElementById('tip'), cross=document.getElementById('cross'), box=document.getElementById('chart');
  const move=e=>{const r=svg.getBoundingClientRect(), k=chartW/r.width, mx=(e.clientX-r.left)*k;
    let best=chartPts[0]; chartPts.forEach(p=>{if(Math.abs(p.x-mx)<Math.abs(best.x-mx))best=p});
    cross.setAttribute('x1',best.x);cross.setAttribute('x2',best.x);cross.setAttribute('visibility','visible');
    tip.hidden=false; tip.innerHTML=`<b>${esc(best.lbl)}</b><br>${esc(best.sub)}`;
    tip.style.left=Math.min(Math.max(best.x/k,70),r.width-70)+'px'; tip.style.top=(best.y/k)+'px'};
  hit.addEventListener('pointermove',move); hit.addEventListener('pointerdown',move);
  hit.addEventListener('pointerleave',()=>{tip.hidden=true;cross.setAttribute('visibility','hidden')});
}

    </section>
    <section class="panel stack"><h3>Sports to cross-train for</h3>
      <div class="chips">${Object.entries(SPORTS).map(([k,s])=>`<button class="chip" data-sport="${k}" aria-pressed="${p.sports.includes(k)}">${esc(s.n)}</button>`).join('')}</div>
      <p class="small muted">${p.sports.length?'Plans add work for '+[...new Set(p.sports.flatMap(s=>Object.entries(SPORTS[s].q).sort((x,y)=>y[1]-x[1]).slice(0,2).map(e=>QUAL[e[0]])))].join(', ')+'.':'Pick any sports you do and plans will add work that carries over.'}</p>
    </section>
    </div>
    <section class="panel stack"><h3>My equipment</h3>
      <div class="chips">${Object.entries(EQUIP).map(([k,n])=>`<button class="chip" data-eq="${k}" aria-pressed="${p.equipment.includes(k)}">${esc(n)}</button>`).join('')}
      ${(p.customEq||[]).map(e=>`<span class="chip" aria-pressed="true" style="background:var(--ink);color:var(--bg)">${esc(e.n)} <button data-rmeq="${e.id}" aria-label="Remove ${esc(e.n)}" style="background:none;border:0;color:inherit;padding:0 0 0 4px">×</button></span>`).join('')}</div>
      <div class="row"><input type="text" id="newEq" placeholder="Something else, e.g. Smith machine" style="flex:1 1 220px"><button class="btn sm" data-act="addEq">Add</button></div>
      <p class="small muted">${EX.filter(x=>avail(x)).length} of ${EX.length} exercises are possible with this. Custom equipment can be used by exercises you add yourself.</p>
    </section>
    <section class="panel stack"><h3>Body &amp; units</h3>
      <div class="row"><div class="chips">${['kg','lb'].map(u=>`<button class="chip" data-units="${u}" aria-pressed="${p.units===u}">${u}</button>`).join('')}</div>
      <label class="field">Bodyweight (${U()})<input type="number" inputmode="decimal" data-bw="1" value="${toDisp(p.bw)}" style="width:120px"></label></div>
      <p class="small muted">Bodyweight is used to score bodyweight exercises and to compare your lifts on the Progress tab.</p>
    </section>
  </div>`;
}

/* ----- Settings ----- */
function viewSettings(){
  const r=state.profile.rest, secs=[30,45,60,75,90,120,150,180,240];
  const sel=(k,l)=>`<label class="field">${l}<select data-rest="${k}">${opt(secs.map(s=>[s,mmss(s)]),r[k])}</select></label>`;
  return `<div class="stack">
    <h2>Settings</h2>
    <section class="panel stack"><h3>Rest timer</h3>
      <div class="ctx">${sel('main','Main lifts')}${sel('acc','Accessories')}${sel('ss','Between superset rounds')}${sel('power','Power & jumps')}${sel('core','Core & small muscles')}</div>
      <div class="row"><button class="chip" data-act="sound" aria-pressed="${state.profile.sound}">Sound &amp; vibration ${state.profile.sound?'on':'off'}</button></div>
      <p class="small muted">The timer beeps 10 seconds before the end and again at zero, then counts how far over you go. Keep the app open during your workout; it keeps the screen on.</p>
    </section>
    <section class="panel stack"><h3>Google Drive</h3>${drivePanel()}</section>
    <section class="panel stack"><h3>Backup &amp; reset</h3>
      <p class="small">Your data is saved in this browser${Drive.on?' and in Google Drive':''}. The backup is a plain file with your workouts and settings, and you can import it into any copy of this app.</p>
      <div class="row"><button class="btn sm" data-act="export">Export backup</button>
      <label class="btn sm" for="importFile" style="display:inline-block">Import backup</label><input type="file" id="importFile" accept="application/json,.json" hidden>
      ${pendingDelete==='ALL'?`<button class="btn sm danger" data-act="resetYes">Erase everything</button><button class="btn sm ghost" data-delcancel="1">Cancel</button>`:`<button class="btn sm ghost danger" data-act="resetAsk">Start over</button>`}</div>
    </section>
  </div>`;
}

/* ----- Drawer: exercise detail or new exercise ----- */
function renderDrawer(){
  const host=document.getElementById('drawerHost');
  if(!selected){host.innerHTML='';return}
  if(selected==='new'){
    host.innerHTML=`<div class="scrim" data-close="1"></div><aside class="drawer" role="dialog" aria-label="Add exercise"><button class="x" data-close="1" aria-label="Close">×</button>
      <h2>Add an exercise</h2>
      <label class="field">Name<input type="text" id="nx-n" placeholder="e.g. Sissy squat"></label>
      <div class="two"><label class="field">Movement<select id="nx-p">${opt(Object.entries(PAT),'single')}</select></label>
      <label class="field">Track by<select id="nx-t">${opt(Object.entries(TRACK),'wr')}</select></label></div>
      <div class="stack" style="gap:6px"><span class="field">Muscles (first one ticked is the main one)</span><div class="checks">${Object.entries(MUS).map(([k,n])=>`<label><input type="checkbox" data-nxm="${k}">${esc(n)}</label>`).join('')}</div></div>
      <div class="stack" style="gap:6px"><span class="field">Needs all of</span><div class="checks">${[...Object.keys(EQUIP),...(state.profile.customEq||[]).map(e=>e.id)].map(k=>`<label><input type="checkbox" data-nxe="${k}">${esc(eqName(k))}</label>`).join('')}</div></div>
      <label class="field">Cues, one per line<textarea id="nx-c" rows="3"></textarea></label>
      <div class="row"><button class="btn primary" data-act="saveEx">Add exercise</button></div></aside>`;
    return;
  }
  const x=BYID[selected]; if(!x){selected=null;host.innerHTML='';return}
  const h=exHistory(x.id), fav=state.profile.favorites.includes(x.id), alts=EX.filter(y=>y.p===x.p&&y.id!==x.id&&avail(y));
  host.innerHTML=`<div class="scrim" data-close="1"></div><aside class="drawer" role="dialog" aria-label="${esc(x.n)}"><button class="x" data-close="1" aria-label="Close">×</button>
    <div><div class="role">${esc(PAT[x.p])}</div><h2>${esc(x.n)}</h2><p class="small muted">${x.m.map(m=>MUS[m]).filter(Boolean).join(', ')}</p></div>
    <div class="row"><button class="btn sm${fav?' primary':''}" data-fav="${x.id}">${fav?'★ Favorite':'☆ Add to favorites'}</button></div>
    ${x.c.length?`<div><h3>Cues</h3><ul>${x.c.map(q=>`<li>${esc(q)}</li>`).join('')}</ul></div>`:''}
    <div><h3>Equipment</h3><p class="small">${esc(eqNeed(x))}${avail(x)?'':' <span style="color:var(--danger)">· not in your list</span>'}</p></div>
    ${x.q.length?`<div><h3>Builds</h3><p class="small">${x.q.map(q=>QUAL[q]).join(', ')}</p></div>`:''}
    <div><h3>Your history</h3>${h.length?`<div>${h.slice(-6).reverse().map(o=>`<div class="entry"><span>${fmtDate(o.ts)}</span><span class="mono small">${o.sets.map(s=>esc(setTxt(x,s))).join(', ')}</span></div>`).join('')}</div>`:'<p class="small muted">Not done yet.</p>'}</div>
    ${alts.length?`<div><h3>Same movement</h3><div class="chips" style="margin-top:6px">${alts.slice(0,8).map(y=>`<button class="chip" data-open="${y.id}">${esc(y.n)}</button>`).join('')}</div></div>`:''}
    ${x.custom?`<div class="row"><button class="btn sm ghost danger" data-rmex="${x.id}">Remove this exercise</button></div>`:''}
  </aside>`;
}

/* ---------------- Events ---------------- */
function toast(t){const h=document.getElementById('toastHost');h.innerHTML=`<div class="toast" role="status">${esc(t)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>h.innerHTML='',2600)}
const toggle=(arr,v)=>{const i=arr.indexOf(v);i>=0?arr.splice(i,1):arr.push(v)};
// Google tokens last an hour. Renew on a tap when it's close to running out.
document.addEventListener('click',e=>{
  if(!driveConfigured()||!Drive.on||Drive.busy||e.target.closest('[data-act^="drive"],#driveResume')) return;
  if(Drive.exp-Date.now()>10*60000||Date.now()-Drive.lastAsk<5*60000) return;
  Drive.lastAsk=Date.now(); driveToken().then(()=>driveSync(false)).catch(()=>showDriveStatus());
},true);
document.addEventListener('click',async e=>{
  const t=e.target.closest('button,[data-open],[data-close]'); if(!t) return;
  const d=t.dataset, p=state.profile;
  if(d.tab){tab=d.tab;selected=null;pendingDelete=null;try{sessionStorage.setItem('fc.tab',tab)}catch(_){};render();window.scrollTo(0,0);return}
  if(d.close){selected=null;render();return}
  if(d.open){selected=d.open;render();return}
  if(d.swap){const [bi,ii]=d.swap.split(':').map(Number); if(swapIn(planCache,bi,ii)){lsSet(LS_PLAN,planCache);render()} return}
  if(d.fav){toggle(p.favorites,d.fav);touchProfile();render();return}
  if(d.eq){toggle(p.equipment,d.eq);touchProfile();render();return}
  if(d.rmeq){p.customEq=p.customEq.filter(x=>x.id!==d.rmeq);touchProfile();render();return}
  if(d.sport){toggle(p.sports,d.sport);if(!p.sports.includes(p.ctx.sport))p.ctx.sport='all';touchProfile();render();return}
  if(d.mus){toggle(p.muscles,d.mus);touchProfile();render();return}
  if(d.units){p.units=d.units;saveProfile();render();return}
  if(d.exshow){exShow=d.exshow;render();return}
  if(d.step&&active&&active.draft){const k=d.step, cur=k==='w'?toDisp(active.draft.w)||0:+(active.draft[k]||0), v=Math.max(0,Math.round((cur+(+d.v))*2)/2);
    active.draft[k]=k==='w'?fromDisp(v):v; saveActive(); const el=document.getElementById('dr-'+k); if(el) el.value=k==='w'?toDisp(active.draft.w):v; return}
  if(d.delask){pendingDelete=d.delask;render();return}
  if(d.delcancel){pendingDelete=null;render();return}
  if(d.del){state.sessions=state.sessions.filter(s=>s.id!==d.del);state.deleted.push(d.del);pendingDelete=null;saveLocal();toast('Workout deleted');render();return}
  if(d.rmex){p.customEx=p.customEx.filter(c=>c.id!==d.rmex);p.favorites=p.favorites.filter(f=>f!==d.rmex);selected=null;touchProfile();rebuildLibrary();render();return}
  switch(d.act){
    case 'start': startWorkout(); return;
    case 'shuffle': reshuffle(); return;
    case 'dismissSum': lastSummary=null; render(); return;
    case 'done': audio(); doneSet(); return;
    case 'startSet': startSet(); return;
    case 'restAdj': if(active&&active.rest){active.rest.plan=Math.max(5,active.rest.plan+(+d.v)); if(active.rest.plan-(Date.now()-active.rest.start)/1000>0){active.rest.beeped=false} saveActive(); tick()} return;
    case 'undo': undoSet(); return;
    case 'skipEx': skipExercise(); return;
    case 'swapRun': {const c=curItem(); if(c&&swapIn(active.plan,c.st.b,c.st.i)){initDraft();saveActive();render()} return}
    case 'workStart': audio(); active.work=Date.now(); active.workBeeped=false; render(); return;
    case 'endAsk': pendingDelete='END'; render(); return;
    case 'endCancel': pendingDelete=null; render(); return;
    case 'endSave': finishWorkout(true); return;
    case 'endDiscard': finishWorkout(false); toast('Workout discarded'); return;
    case 'addEq': {const el=document.getElementById('newEq'), n=(el.value||'').trim(); if(!n) return; p.customEq=p.customEq||[]; p.customEq.push({id:'eq'+uid6(),n}); touchProfile(); render(); return}
    case 'saveEx': {
      const n=(document.getElementById('nx-n').value||'').trim(); if(!n){toast('Give it a name');return}
      const m=[...document.querySelectorAll('[data-nxm]:checked')].map(i=>i.dataset.nxm), eq=[...document.querySelectorAll('[data-nxe]:checked')].map(i=>i.dataset.nxe);
      const c={id:'cx'+uid6(),n,p:document.getElementById('nx-p').value,t:document.getElementById('nx-t').value,m,eq,c:document.getElementById('nx-c').value.split('\n').map(s=>s.trim()).filter(Boolean)};
      p.customEx=p.customEx||[]; p.customEx.push(c); p.favorites.push(c.id); touchProfile(); rebuildLibrary(); selected=c.id; toast('Added to your exercises and favorites'); render(); return}
    case 'sound': p.sound=!p.sound; saveProfile(); render(); if(p.sound) beep(); return;
    case 'resetAsk': pendingDelete='ALL'; render(); return;
    case 'resetYes': state={profile:defaultProfile(),sessions:[],deleted:state.deleted.concat(state.sessions.map(s=>s.id))}; pendingDelete=null; planCache=null; saveProfile(); rebuildLibrary(); toast('Everything erased'); render(); return;
    case 'driveConnect': case 'driveSync': driveSync(true); return;
    case 'driveOff': driveDisconnect(); return;
    case 'export': {
      const data=JSON.stringify({app:'fitness-coach',exported:new Date().toISOString(),...state},null,2);
      try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download='fitness-coach-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();toast('Backup downloaded')}
      catch(_){try{await navigator.clipboard.writeText(data);toast('Backup copied to clipboard')}catch(__){toast('Export isn’t available here')}}
      return}
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&selected){selected=null;render()}});
document.addEventListener('input',e=>{
  const t=e.target, d=t.dataset;
  if(d.draft&&active&&active.draft){const v=t.value===''?null:+t.value; active.draft[d.draft]=d.draft==='w'?fromDisp(v):v; saveActive(); return}
  if(d.balance){const a=+t.value; document.getElementById('mixTxt').textContent=a<=35?'Plans lean toward muscle and shape.':a>=65?'Plans lean toward performance and sport.':'A mix of strength, power and physique work.'}
});
document.addEventListener('change',async e=>{
  const t=e.target, d=t.dataset, p=state.profile;
  if(d.ctx){p.ctx[d.ctx]=d.ctx==='minutes'?+t.value:t.value;saveProfile();render();return}
  if(d.rest){p.rest[d.rest]=+t.value;saveProfile();return}
  if(d.balance){p.balance=+t.value;touchProfile();render();return}
  if(d.bw){const v=fromDisp(t.value); if(v&&v>20&&v<400){p.bw=v;saveProfile()} else toast('Enter your bodyweight');return}
  if(d.exfilter){exFilter=t.value;render();return}
  if(d.chart){chartEx=t.value;render();return}
  if(t.id==='importFile'&&t.files[0]){
    try{const j=JSON.parse(await t.files[0].text()); if(!j.profile||!Array.isArray(j.sessions)) throw 0;
      const have=new Set(state.sessions.map(s=>s.id)), add=j.sessions.filter(s=>s&&s.id&&Array.isArray(s.entries)&&!have.has(s.id));
      state.profile=fixProfile(j.profile); state.sessions=state.sessions.concat(add).sort((a,b)=>a.ts<b.ts?-1:1);
      saveProfile(); rebuildLibrary(); planCache=null; toast(`Imported ${add.length} workouts`); render();
    }catch(_){toast('That file isn’t a Fitness Coach backup.')}
  }
});

render();
showDriveStatus();
if(active) keepAwake(true);
if(driveConfigured()&&Drive.on){
  loadGis().catch(()=>{});
  if(driveLive()) driveSync(false);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&driveLive()&&!active) driveSync(false)});
}
</script>
</body>
</html>
